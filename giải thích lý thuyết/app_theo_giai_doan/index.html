<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>Lý thuyết đồ án — theo giai đoạn</title>

<style>
:root{
  --bg:#eceff3; --surface:#ffffff; --surface-2:#f5f7f9; --line:#d3dae2;
  --ink:#0e1519; --ink-2:#3d4b57; --muted:#68798a;
  --accent:#14507d; --accent-soft:#e3edf6;
  --ok:#1f6b4e; --ok-soft:#e0f0e8;
  --no:#a3352f; --no-soft:#f7e3e1;
  --warn:#8a5a10; --warn-soft:#f7ecd8;
  --code-bg:#101820; --code-ink:#d7e2ea;
  --mono:ui-monospace,"Cascadia Code","JetBrains Mono","SF Mono",Consolas,monospace;
  --sans:"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --rail:280px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0b1014; --surface:#141b21; --surface-2:#1a232b; --line:#2a3742;
    --ink:#e6edf3; --ink-2:#b3c1cd; --muted:#8698a7;
    --accent:#6fb0e6; --accent-soft:#16293a;
    --ok:#63c39a; --ok-soft:#162b23;
    --no:#e5877f; --no-soft:#2e1a19;
    --warn:#dcae62; --warn-soft:#2c2416;
    --code-bg:#070b0e; --code-ink:#cdd9e2;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1014; --surface:#141b21; --surface-2:#1a232b; --line:#2a3742;
  --ink:#e6edf3; --ink-2:#b3c1cd; --muted:#8698a7;
  --accent:#6fb0e6; --accent-soft:#16293a;
  --ok:#63c39a; --ok-soft:#162b23;
  --no:#e5877f; --no-soft:#2e1a19;
  --warn:#dcae62; --warn-soft:#2c2416;
  --code-bg:#070b0e; --code-ink:#cdd9e2;
}
:root[data-theme="light"]{
  --bg:#eceff3; --surface:#ffffff; --surface-2:#f5f7f9; --line:#d3dae2;
  --ink:#0e1519; --ink-2:#3d4b57; --muted:#68798a;
  --accent:#14507d; --accent-soft:#e3edf6;
  --ok:#1f6b4e; --ok-soft:#e0f0e8;
  --no:#a3352f; --no-soft:#f7e3e1;
  --warn:#8a5a10; --warn-soft:#f7ecd8;
  --code-bg:#101820; --code-ink:#d7e2ea;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.65;
  font-size:16px;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}
.rail{border-right:1px solid var(--line);background:var(--surface);position:sticky;top:0;height:100vh;
  overflow-y:auto;padding:20px 0 40px}
.rail-head{padding:0 18px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.rail-title{font-size:15px;font-weight:700;letter-spacing:-.01em;line-height:1.3;margin:6px 0 2px;cursor:pointer}
.rail-sub{font-size:12px;color:var(--muted)}
.search{width:100%;margin-top:12px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;
  background:var(--surface-2);color:var(--ink);font-family:var(--mono);font-size:12.5px}
.search:focus{outline:2px solid var(--accent);outline-offset:1px}
.grp{padding:10px 10px 4px}
.grp-h{display:flex;gap:9px;align-items:baseline;padding:7px 8px;border-radius:6px;cursor:pointer}
.grp-h:hover{background:var(--surface-2)}
.grp-n{font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:700;flex:none}
.grp-t{font-size:13px;font-weight:600;line-height:1.35}
.grp-c{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-left:auto;flex:none}
.grp ul{list-style:none;margin:2px 0 6px;padding:0 0 0 8px;border-left:1px solid var(--line);margin-left:14px}
.grp li a{display:block;padding:5px 8px;font-size:13px;color:var(--ink-2);text-decoration:none;border-radius:5px;line-height:1.35}
.grp li a:hover{background:var(--surface-2);color:var(--ink)}
.grp li a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.main{padding:34px 40px 90px;max-width:960px}

/* ---------- home ---------- */
h1{font-size:32px;line-height:1.2;letter-spacing:-.02em;margin:8px 0 10px;text-wrap:balance}
h2{font-size:22px;letter-spacing:-.015em;margin:34px 0 12px;text-wrap:balance}
.lede{font-size:17px;color:var(--ink-2);max-width:62ch}
.note{border-left:3px solid var(--accent);background:var(--surface);padding:12px 16px;margin:22px 0;
  font-size:14.5px;color:var(--ink-2);border-radius:0 6px 6px 0}
.tl{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.tl-item{display:grid;grid-template-columns:64px minmax(0,1fr);gap:16px;background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:14px 16px;text-decoration:none;color:inherit}
.tl-item:hover{border-color:var(--accent)}
.tl-n{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--accent);
  border-right:1px solid var(--line);display:flex;align-items:center}
.tl-t{font-weight:650;font-size:15.5px;margin-bottom:3px}
.tl-q{font-size:13.5px;color:var(--muted)}
.tl-r{font-family:var(--mono);font-size:12px;color:var(--ok);margin-top:5px}

/* ---------- detail ---------- */
.crumb{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-bottom:6px}
.crumb a{color:var(--muted);text-decoration:none}
.crumb a:hover{color:var(--accent)}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin:16px 0;overflow:hidden}
.blk-h{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);
  background:var(--surface-2)}
.blk-h .eyebrow{font-weight:700;color:var(--ink-2)}
.blk-b{padding:16px 18px}
.blk-b > :first-child{margin-top:0}
.blk-b > :last-child{margin-bottom:0}
.blk-b p{margin:0 0 12px;max-width:70ch}
.blk-b ul{margin:0 0 12px;padding-left:20px}
.blk-b li{margin-bottom:5px}
.formula{font-family:var(--mono);background:var(--surface-2);border:1px solid var(--line);
  padding:11px 14px;border-radius:6px;font-size:14px;overflow-x:auto;margin:0 0 12px}
code{font-family:var(--mono);font-size:.9em;background:var(--surface-2);border:1px solid var(--line);
  padding:1px 5px;border-radius:4px}
pre{margin:0;background:var(--code-bg);color:var(--code-ink);padding:13px 15px;overflow-x:auto;
  font-family:var(--mono);font-size:12.5px;line-height:1.6}
pre code{background:none;border:0;padding:0;color:inherit;font-size:inherit}
.src{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;color:var(--muted);
  padding:8px 15px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.src b{color:var(--accent);font-weight:600}
.codewrap{border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:0 0 12px}
.cnote{font-size:13.5px;color:var(--muted);padding:9px 15px;background:var(--surface-2);
  border-top:1px solid var(--line)}

/* ---------- decision ledger ---------- */
.ledger{width:100%;border-collapse:collapse;font-size:14px}
.ledger th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);font-weight:600;padding:0 12px 8px 0;border-bottom:1px solid var(--line)}
.ledger td{padding:11px 12px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
.ledger tr:last-child td{border-bottom:0}
.ledger td:first-child{font-weight:600;width:26%}
.ledger td:nth-child(2){width:110px}
.chip{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.05em;
  padding:2px 7px;border-radius:4px;white-space:nowrap;text-transform:uppercase}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.no{background:var(--no-soft);color:var(--no)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.ev{list-style:none;padding:0;margin:0}
.ev li{display:flex;gap:10px;padding:7px 0;border-bottom:1px dotted var(--line);font-size:14px}
.ev li:last-child{border-bottom:0}
.ev b{font-family:var(--mono);font-size:12.5px;color:var(--accent);flex:none;min-width:0}
.gap{border-left:3px solid var(--no);background:var(--no-soft);padding:12px 16px;border-radius:0 6px 6px 0;
  font-size:14px;color:var(--ink-2);margin:0}
.gap strong{color:var(--no)}
.hits{font-family:var(--mono);font-size:12px;color:var(--muted);padding:4px 18px 8px}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .main{padding:24px 18px 60px}
  .ledger td:first-child{width:auto}
}
</style>

<div class="shell">
  <nav class="rail">
    <div class="rail-head">
      <div class="eyebrow">Đồ án tốt nghiệp · Hybrid NIDS</div>
      <div class="rail-title" id="home-link">Lý thuyết theo giai đoạn</div>
      <div class="rail-sub">Vì sao chọn → chạy thế nào trong code → vì sao không dùng cái tương tự</div>
      <input class="search" id="q" type="search" placeholder="tìm: focal, surgery, portscan…" autocomplete="off">
    </div>
    <div class="hits" id="hits"></div>
    <div id="nav"></div>
  </nav>
  <main class="main" id="main"></main>
</div>

<script>
const PHASES = [
  {id:"gd0", n:"GĐ 0", title:"Nền tảng bài toán & dữ liệu",
   q:"Bài toán này thực chất là bài toán học máy gì, và dữ liệu vào là cái gì?",
   result:"Chốt: phân loại có giám sát trên flow, 80 đặc trưng, đo bằng Macro-F1",
   ws:"xuyên suốt cả 5 giai đoạn",
   intro:"Trước khi bàn kiến trúc, phải chốt ba thứ: (1) IDS được quy về bài toán học máy nào, (2) một 'mẫu' là gì và có những trường nào, (3) đo bằng chỉ số nào để con số không đánh lừa mình. Ba lựa chọn này ràng buộc toàn bộ 5 giai đoạn sau — đặc biệt việc chọn <em>flow</em> làm đơn vị mẫu là thứ về sau sinh ra giới hạn PortScan."},
  {id:"gd1", n:"GĐ 1", title:"NSL-KDD — chứng minh tính khả thi",
   q:"FT-Transformer có thực sự ăn được dữ liệu bảng của IDS không?",
   result:"Macro-F1 ≈ 0,681 (Stacking: LightGBM + FTT + Meta-LR)",
   ws:"NSL_KDD_Workspace/",
   intro:"Giai đoạn thăm dò trên bộ dữ liệu kinh điển. Mục tiêu không phải điểm cao mà là trả lời: kiến trúc Transformer cho dữ liệu bảng có hoạt động không, và có đáng để mang sang bộ dữ liệu lớn không. Ở đây định hình 3 khối lõi của FT-Transformer (dùng lại nguyên vẹn đến tận GĐ5) và bài học đầu tiên về ensemble."},
  {id:"gd2", n:"GĐ 2", title:"CIC-IDS-2017 — quy mô lớn & mất cân bằng",
   q:"Lên 2,8 triệu flow / 9 lớp cực lệch thì phải làm gì để lớp hiếm không bị nuốt?",
   result:"Accuracy 99,55% · Macro-F1 0,9294 (Cascade + Asymmetric Voting)",
   ws:"CIC_IDS_2017_Workspace/",
   intro:"Đây là nơi hầu hết lý thuyết 'nặng' được đưa vào, và mỗi thứ đều sinh ra từ một triệu chứng cụ thể: lớp đông nuốt gradient (→ Focal Loss), một model tự tin sai (→ ensemble khác inductive bias), Benign bị báo nhầm (→ voting bất đối xứng + hard negative mining), và 99% traffic là Benign nên không cần model nặng xử lý hết (→ cascade hai tầng)."},
  {id:"gd3", n:"GĐ 3", title:"Testbed thật & thích nghi miền",
   q:"Model 99% trên CIC-IDS-2017 đem sang mạng WSL thật thì sập. Vì sao và cứu thế nào?",
   result:"V8.5: Macro-F1 91,7% trên testbed (80 feature, 5 lớp)",
   ws:"Custom_IDS_Testbed/ · Domain_Adaptation_Workspace/ · Phase3_4_Retrain/",
   intro:"Giai đoạn 'vỡ mộng' và cũng là giai đoạn có giá trị khoa học nhất: model gần như hoàn hảo trên benchmark rơi thẳng khi gặp traffic thật. Chuỗi lý thuyết ở đây là một chuỗi <em>chẩn đoán</em>: đo lệch phân phối → thử cách rẻ nhất (re-fit scaler) → hiểu vì sao nó thất bại → mới đi tới freezing + model surgery. Nhiều lý thuyết ở đây được ghi lại kèm <strong>kết quả âm</strong>, vì chính chúng biện minh cho lựa chọn cuối."},
  {id:"gd4", n:"GĐ 4", title:"Hệ lai Snort + FT-Transformer",
   q:"Vì sao vẫn cần Snort khi đã có deep learning, và hai tầng nói chuyện với nhau kiểu gì?",
   result:"Pipeline E2E chạy trên LAN thật xuyên máy (WSL2 mirrored)",
   ws:"Custom_IDS_Testbed/",
   intro:"Hai triết lý phát hiện — dựa trên dấu hiệu (signature) và dựa trên bất thường (anomaly) — có điểm mù bù nhau. Giai đoạn này là phần <em>hệ thống</em>: ghép Snort, CICFlowMeter và FT-Transformer thành một đường ống, và giải bài toán đồng bộ nhãn giữa hai nguồn cảnh báo khác đơn vị (gói tin vs flow)."},
  {id:"gd5", n:"GĐ 5", title:"Realtime — Replay & Live micro-batch",
   q:"Chạy thật thì model sai ở đâu, và sửa được bằng gì mà không phải train lại?",
   result:"Macro-F1 end-to-end 0,978 · PortScan F1 0,996 (nhờ luật hậu xử lý)",
   ws:"live_detection/",
   intro:"Giai đoạn đối mặt với sự thật: trên benign thật, model V8.5 báo giả <strong>24,68%</strong>. Ở đây có ba lớp lý thuyết chồng nhau — hậu xử lý bằng luật (rẻ, không train lại), hiệu chỉnh xác suất (temperature scaling), và cuối cùng là fine-tune với benign thật. Kèm theo là những lỗ hổng đã tự phát hiện khi rà soát, được ghi thẳng ra thay vì giấu."}
];

const T = [];
/* ---------- GĐ 0 ---------- */
T.push({
id:"ids-flow", phase:"gd0", tag:"Khung bài toán", title:"IDS = phân loại có giám sát trên flow",
one:"Quy phát hiện xâm nhập về bài toán phân loại đa lớp trên một vector đặc trưng tổng hợp từ một luồng mạng.",
why:`<p>Một cuộc tấn công không nằm trong một gói tin đơn lẻ — nó nằm trong <em>hình dạng</em> của cả cuộc trao đổi:
gửi bao nhiêu gói, gói to hay nhỏ, cách nhau bao lâu, ai nói nhiều hơn ai. Nếu nhìn từng gói, một gói SYN của
kẻ quét cổng và một gói SYN của người dùng thật <strong>giống hệt nhau</strong>.</p>
<p>Vì vậy đơn vị mẫu của toàn bộ đồ án là <strong>flow</strong> (một chiều hội thoại 5-tuple: IP nguồn, IP đích,
cổng nguồn, cổng đích, giao thức), và mỗi flow được nén thành một vector số. Bài toán trở thành:
cho vector 80 chiều → trả về 1 trong 5 nhãn.</p>`,
how:`<p>Đầu vào là ma trận <code>X ∈ R^(n×80)</code>, đầu ra là nhãn trong tập {Benign, DoS, PortScan, Brute Force,
Web Attack}. Mô hình học ánh xạ <code>f: R^80 → R^5</code> rồi lấy softmax.</p>
<div class="formula">ŷ = argmax_c  softmax(f(x))_c        conf = max_c softmax(f(x))_c</div>
<p>Điểm mấu chốt: <strong>flow là ảnh chụp tĩnh</strong>. Toàn bộ thông tin thời gian đã bị nén thành thống kê
(mean/std/max/min của khoảng cách giữa các gói). Model không thấy chuỗi, chỉ thấy tóm tắt.</p>`,
codeIntro:`<p>Định nghĩa cứng của "một mẫu là gì" nằm ở danh sách 80 cột — đây là hợp đồng mà mọi tầng khác phải tuân theo:</p>`,
code:[{file:"live_detection/ids_replay/features.py", lines:"9–11, 18–50",
snippet:`EXPECTED_FEATURES_80 = [
    'Flow_Duration', 'Total_Fwd_Packets', ... 'Idle_Min',
    'Port_Is_Web', ... 'Custom_Pkt_Size_Ratio',
]

class FeatureExtractor:
    """Chuyển DataFrame CICFlowMeter (raw) → ma trận 80 feature đúng thứ tự model cần."""
    features = EXPECTED_FEATURES_80

    def build(self, df):
        ...
        X = df[EXPECTED_FEATURES_80].values.astype(np.float32)
        return np.nan_to_num(X, nan=0.0, posinf=0.0, neginf=0.0)`,
note:"Thứ tự cột là bất biến sống còn: model nạp trọng số theo <em>vị trí</em>, đảo cột = đảo nghĩa đặc trưng mà không báo lỗi."},
{file:"live_detection/ids_replay/model.py", lines:"47–58",
snippet:`def predict(self, X):
    Xs = self.scaler.transform(X)
    with torch.no_grad():
        for i in range(0, len(Xs), 1024):
            probs = torch.softmax(self.model(torch.FloatTensor(Xs[i:i+1024])), dim=1)
            conf, idx = probs.max(dim=1)
    return self.encoder.inverse_transform(idxs), confs`,
note:"Toàn bộ bài toán rút gọn về đúng 3 dòng: scale → forward → argmax + confidence."}],
alts:[
{name:"Phân tích từng gói tin (DPI / payload)", v:"no", why:"Cần đọc nội dung gói — hỏng hoàn toàn với traffic mã hoá (HTTPS), lại nặng và có vấn đề riêng tư. Flow-based chỉ dùng metadata nên vẫn chạy được trên traffic mã hoá."},
{name:"Mô hình chuỗi thời gian trên chuỗi gói (LSTM/Transformer theo gói)", v:"no", why:"Đúng về mặt lý thuyết và bắt được PortScan tốt hơn, nhưng đòi giữ trạng thái theo từng flow trong bộ nhớ và không dùng lại được CICFlowMeter — chi phí kỹ thuật vượt phạm vi đồ án. Đây được ghi là <strong>hướng phát triển</strong>, và chính là gốc rễ của giới hạn PortScan."},
{name:"Phát hiện bất thường không giám sát (chỉ học Benign)", v:"no", why:"Không cho ra <em>loại</em> tấn công, chỉ nói bất thường/không. Đề tài cần phân loại 5 lớp để cảnh báo có ý nghĩa hành động."},
{name:"Phân loại có giám sát trên flow 80 chiều", v:"ok", why:"Chạy được trên traffic mã hoá, tái dùng CICFlowMeter, cho ra nhãn cụ thể, và có dữ liệu gán nhãn (CIC-IDS-2017 + testbed tự thu)."}],
gap:`<strong>Hệ quả phải nói trước hội đồng:</strong> chọn flow tĩnh làm đơn vị mẫu là nguyên nhân <em>gốc</em> khiến
PortScan không phân tách được bằng model (xem mục PortScan & NAT ở GĐ 3) — vì bản chất PortScan là quan hệ
<em>giữa nhiều flow</em>, không nằm trong bất kỳ flow đơn lẻ nào.`
});

T.push({
id:"flow-features", phase:"gd0", tag:"Đặc trưng", title:"CICFlowMeter + 12 đặc trưng tự chế",
one:"68 thống kê chuẩn từ CICFlowMeter, cộng 5 cờ nhóm cổng và 7 tỉ số tự thiết kế để lộ hành vi tấn công.",
why:`<p>CICFlowMeter cho sẵn ~68 con số mô tả một flow, nhưng chúng là thống kê <em>thô</em>. Một số hành vi tấn công
chỉ hiện ra khi <strong>lấy tỉ số</strong> giữa hai con số thô — ví dụ Slowloris giữ kết nối mở rất lâu nhưng gửi
cực ít gói: nhìn riêng "thời lượng" hay riêng "số gói" đều bình thường, nhìn tỉ số mới thấy dị.</p>
<p>Model học được tỉ số này về lý thuyết, nhưng phải tốn dung lượng mạng để học phép chia. Đưa sẵn tỉ số vào =
tiêm tri thức chuyên ngành (domain knowledge), giúp mạng nhỏ vẫn học được.</p>`,
how:`<p>Ba nhóm đặc trưng, cộng lại đúng 80:</p>
<ul>
<li><strong>68 thống kê CICFlowMeter</strong> — thời lượng, số gói, độ dài gói (max/min/mean/std), IAT (khoảng
cách giữa các gói), 8 cờ TCP, Init_Win_bytes, Active/Idle…</li>
<li><strong>5 cờ nhóm cổng</strong> — one-hot hoá cổng đích thành các nhóm ngữ nghĩa (Web / RemoteAccess /
WellKnown / Registered / Ephemeral) thay vì để số cổng thô.</li>
<li><strong>7 tỉ số tự chế</strong> — mỗi tỉ số nhắm một loại tấn công cụ thể.</li>
</ul>
<div class="formula">Custom_Slow_Index = Flow_Duration / Flow_IAT_Max      → Slowloris (giữ kết nối, gửi nhỏ giọt)
Custom_IAT_CV    = Flow_IAT_Std / Flow_IAT_Mean       → nhịp đều như máy (bot) vs người
Custom_Bwd_Pkt_Ratio = Bwd_Packets / Fwd_Packets      → PortScan: gửi nhiều, gần như không nhận lại</div>`,
codeIntro:`<p>Toàn bộ 12 đặc trưng bổ sung được tính tại chỗ, ngay trước khi đưa vào model — nghĩa là suy luận
live không cần bất kỳ bước tiền xử lý ngoại vi nào:</p>`,
code:[{file:"live_detection/ids_replay/features.py", lines:"28–45",
snippet:`p = df['Destination_Port'].astype(int)
df['Port_Is_Web']           = p.isin([80, 443, 8080, 8443, 8888]).astype(int)
df['Port_Is_RemoteAccess']  = p.isin([21, 22, 23, 2222, 3389]).astype(int)
df['Port_Is_WellKnown']     = (p <= 1023).astype(int)

fd = df['Flow_Duration'].astype(float).replace(0, 1)          # tránh chia 0
df['Custom_Fwd_Pkt_Rate']   = df['Total_Fwd_Packets'] / (fd / 1e6)
df['Custom_Slow_Index']     = fd / df['Flow_IAT_Max'].replace(0, 1)
df['Custom_IAT_CV']         = df['Flow_IAT_Std'] / (df['Flow_IAT_Mean'] + 1e-6)
df['Custom_Bwd_Pkt_Ratio']  = df['Total_Backward_Packets'] / (df['Total_Fwd_Packets'] + 1e-6)
df['Custom_Pkt_Size_Ratio'] = df['Min_Packet_Length'] / (df['Max_Packet_Length'] + 1e-6)`,
note:"Mọi mẫu số đều được <code>replace(0,1)</code> hoặc <code>+1e-6</code>: flow một-gói có Duration = 0 là chuyện thường trong traffic thật, chia 0 sẽ sinh inf rồi NaN xuyên suốt mạng."}],
codeOutro:`<p>Cái giá phải trả: chính 3 trong số các đặc trưng tự chế này (<code>Custom_Bwd_Pkt_Ratio</code>,
<code>Custom_IAT_Anomaly</code>, <code>Custom_Pkt_Size_Ratio</code>) về sau nằm trong nhóm <strong>lệch phân phối
mạnh nhất</strong> giữa lab và mạng thật — vì chúng là tỉ số, sai số ở mẫu số bị khuếch đại.</p>`,
alts:[
{name:"Dùng thẳng số cổng đích làm đặc trưng số", v:"no", why:"Cổng là biến <em>định danh</em>, không phải biến thứ tự: cổng 443 không 'lớn hơn' cổng 80 theo nghĩa nào cả. Đưa số thô vào sẽ dạy model một quan hệ thứ tự không tồn tại. One-hot theo nhóm ngữ nghĩa giữ đúng bản chất."},
{name:"Để model tự học tỉ số từ đặc trưng thô", v:"no", why:"Mạng phải học phép chia — tốn dung lượng và dữ liệu. Với lớp hiếm (Brute Force, Web Attack chỉ vài trăm mẫu) thì không đủ dữ liệu để học nổi."},
{name:"Học biểu diễn tự động (autoencoder → embedding)", v:"no", why:"Mất tính giải thích được. IDS cần nói rõ 'vì gói backward gần bằng 0' để người vận hành tin — embedding ẩn không làm được."},
{name:"68 thống kê + 5 cờ cổng + 7 tỉ số thủ công", v:"ok", why:"Giữ được tính giải thích, tiêm domain knowledge cho lớp hiếm, và tính được ngay trong pipeline live không cần dịch vụ ngoài."}],
ev:[["12 đặc trưng","số cột tự thêm ngoài CICFlowMeter (5 cờ cổng + 7 tỉ số)"],
["KS-test","Custom_Bwd_Pkt_Ratio, Custom_IAT_Anomaly nằm trong nhóm lệch mạnh nhất lab↔thật (GĐ5, Bước 1)"]]
});

T.push({
id:"metrics", phase:"gd0", tag:"Đo lường", title:"Vì sao Accuracy là con số dối trá — Macro-F1 & MCC",
one:"Với DoS:PortScan ≈ 164:1, một model đoán bừa 'DoS' đã đạt Accuracy rất cao mà không phát hiện được gì.",
why:`<p>Dữ liệu testbed cực lệch: run5 có 91.600 flow DoS nhưng chỉ 442 flow PortScan và 271 Web Attack. Một model
ngu ngốc luôn trả lời "DoS" sẽ có Accuracy ~82% — nghe như thành công, thực chất là <strong>vô dụng</strong>.</p>
<p>Accuracy lấy trung bình theo <em>mẫu</em>, nên lớp đông áp đảo. Macro-F1 lấy trung bình theo <em>lớp</em>: lớp
PortScan 442 mẫu có cùng trọng số với lớp DoS 91.600 mẫu. Bỏ sót lớp hiếm là bị phạt nặng ngay.</p>`,
how:`<div class="formula">Macro-F1 = (1/C) · Σ_c  F1_c        F1_c = 2·P_c·R_c / (P_c + R_c)</div>
<p>MCC (Matthews Correlation Coefficient) đi xa hơn: nó dùng cả 4 ô của ma trận nhầm lẫn (TP, TN, FP, FN), nên

<p>Trong IDS còn một chỉ số nữa quan trọng không kém: <strong>FPR trên benign</strong> — báo giả nhiều thì người
vận hành sẽ tắt hệ thống, và lúc đó recall bằng bao nhiêu cũng vô nghĩa.</p>`,

T.push({
id:"feature-tokenizer", phase:"gd1", tag:"Kiến trúc · 1/3", title:"Feature Tokenizer — biến mỗi cột số thành một 'từ'",
one:"Transformer cần chuỗi token, nhưng dữ liệu bảng là một hàng số. Feature Tokenizer là cây cầu đó.",
why:`<p>Transformer sinh ra cho ngôn ngữ: đầu vào là <em>chuỗi các token</em>, mỗi token là một vector. Dữ liệu IDS
lại là một hàng 80 con số vô hướng. Không thể nhét thẳng vào Attention.</p>
<p>Ý tưởng của FT-Transformer (Gorishniy et al., 2021): coi <strong>mỗi đặc trưng là một token</strong>. Mỗi cột
có một vector nhúng <em>riêng</em> — <code>Flow_Duration</code> và <code>SYN_Flag_Count</code> có không gian
biểu diễn khác nhau, vì chúng mang ý nghĩa khác nhau, dù đều là số.</p>`,
how:`<p>Mỗi đặc trưng <em>j</em> có một cặp tham số học được (W_j, b_j), biến giá trị vô hướng x_j thành vector d chiều:</p>
<div class="formula">token_j = x_j · W_j + b_j        (W_j, b_j ∈ R^d,  d = 128)</div>
<p>Kết quả: 80 số → 80 token, mỗi token 128 chiều. Sau đó ghép thêm một token <strong>[CLS]</strong> học được vào
đầu chuỗi — token này không ứng với đặc trưng nào, nhiệm vụ của nó là <em>đi thu thập</em> thông tin từ 80 token kia
qua các tầng Attention, và cuối cùng chính nó được đưa vào bộ phân lớp.</p>
<div class="formula">chuỗi vào Transformer:  [CLS] + [token_1 … token_80]   →  (81, 128)</div>`,
code:[{file:"live_detection/model_defs/phase2_ft_transformer_v2.py", lines:"68–105",
snippet:`class FeatureEmbedding(nn.Module):
    def __init__(self, num_features: int, d_model: int):
        super().__init__()
        # MỖI đặc trưng một Linear(1 → d_model) riêng
        self.feature_embeddings = nn.ModuleList(
            [nn.Linear(1, d_model) for _ in range(num_features)])
        # Token [CLS] có thể học được
        self.cls_token = nn.Parameter(torch.randn(1, 1, d_model))

    def forward(self, x):
        tokens = [emb(x[:, i:i+1]) for i, emb in enumerate(self.feature_embeddings)]
        x = torch.stack(tokens, dim=1)               # (B, 80, 128)
        cls = self.cls_token.expand(x.size(0), -1, -1)
        return torch.cat([cls, x], dim=1)            # (B, 81, 128)`,
note:"<code>nn.ModuleList</code> 80 Linear riêng biệt — đây chính là chỗ khiến <strong>Model Surgery</strong> ở GĐ3 khả thi: muốn thêm 3 đặc trưng chỉ cần thêm 3 Linear mới, 77 cái cũ giữ nguyên trọng số."}],
alts:[
{name:"Một Linear chung (80 → d) cho cả hàng (MLP thường)", v:"no", why:"Trộn hết đặc trưng ngay ở tầng đầu → không còn khái niệm 'token của đặc trưng j' → Attention không có gì để so sánh cặp-đặc-trưng. Mất luôn khả năng làm Model Surgery ở GĐ3."},
{name:"Chia bin rồi nhúng như từ vựng (giống NLP)", v:"no", why:"Mất thông tin thứ tự/độ lớn của số thực và phải chọn số bin — thêm siêu tham số nhạy cảm, trong khi đặc trưng flow có dải giá trị rất rộng (Flow_Duration từ 0 đến hàng triệu)."},
{name:"Một Linear(1→d) riêng cho từng cột + [CLS] học được", v:"ok", why:"Giữ danh tính từng đặc trưng, cho Attention học tương tác cặp, và mở đường cho việc ghép thêm đặc trưng mới mà không phá trọng số cũ."}]
});

T.push({
id:"mhsa", phase:"gd1", tag:"Kiến trúc · 2/3", title:"Multi-Head Self-Attention — học tương tác giữa các đặc trưng",
one:"Cái mà cây quyết định phải tách nhiều nhánh mới diễn tả được, Attention học thẳng thành một trọng số.",
why:`<p>Dấu hiệu tấn công hiếm khi nằm ở một đặc trưng đơn. Slowloris = <em>thời lượng dài</em> <strong>VÀ</strong>
<em>số gói ít</em> <strong>VÀ</strong> <em>cổng là web</em>. Đây là <strong>tương tác</strong> giữa các đặc trưng.</p>
<p>MLP thường phải học tương tác một cách gián tiếp qua nhiều tầng. Self-Attention cho phép mỗi đặc trưng
<strong>nhìn thẳng</strong> vào mọi đặc trưng khác và tự quyết định "tôi nên chú ý tới ai".</p>`,
how:`<p>Mỗi token sinh ra 3 vector: Query (tôi đang tìm gì), Key (tôi có gì), Value (nội dung tôi mang).
Điểm tương đồng giữa Query của token i và Key của token j quyết định token i "nghe" token j bao nhiêu:</p>
<div class="formula">Attention(Q,K,V) = softmax( Q·Kᵀ / √d_k ) · V</div>
<ul>
<li><code>Q·Kᵀ</code> → ma trận 81×81: mức độ liên quan của <em>mọi cặp</em> đặc trưng.</li>
<li><code>/√d_k</code> → chống việc tích vô hướng phình to làm softmax bão hoà (gradient chết).</li>
<li><code>softmax</code> → chuẩn hoá thành trọng số chú ý cộng lại bằng 1.</li>
<li><strong>Multi-head</strong> (8 đầu) → 8 "góc nhìn" song song: đầu này chuyên bắt quan hệ về thời gian,
đầu kia về kích thước gói… rồi ghép lại.</li>
</ul>`,
code:[{file:"live_detection/model_defs/phase2_ft_transformer_v2.py", lines:"107–129",
snippet:`class MultiHeadSelfAttention(nn.Module):
    def forward(self, x):
        B, N, C = x.shape
        qkv = self.qkv(x).reshape(B, N, 3, self.num_heads, C // self.num_heads)
        q, k, v = qkv.permute(2, 0, 3, 1, 4)

        attn = (q @ k.transpose(-2, -1)) * self.scale   # scale = 1/sqrt(d_k)
        attn = attn.softmax(dim=-1)                     # (B, heads, 81, 81)
        attn = self.attn_drop(attn)

        x = (attn @ v).transpose(1, 2).reshape(B, N, C)
        return self.proj(x)`,
note:"Ma trận attention 81×81 chính là thứ có thể trích ra để <em>giải thích</em> cảnh báo: đặc trưng nào đã chi phối quyết định. Model chạy trong live dùng <code>num_heads=8, d_model=128</code> → mỗi đầu 16 chiều."},
{file:"live_detection/ids_replay/model.py", lines:"36–38",
snippet:`self.model = FTTransformer(num_features=80, num_classes=len(self.encoder.classes_),
                           d_model=128, num_heads=8, num_layers=4, d_ff=512,
                           dropout=0.15, drop_path_rate=0.15)`,
note:"Siêu tham số thật của model đang chạy production: 4 tầng, 8 đầu, 128 chiều."}],
alts:[
{name:"MLP nhiều tầng", v:"no", why:"Học được tương tác nhưng gián tiếp và tốn tầng; không cho ra trọng số tương tác đọc được. Đã dùng làm baseline ở GĐ1."},
{name:"CNN 1D trên vector đặc trưng", v:"no", why:"Convolution giả định các đặc trưng <em>cạnh nhau</em> có quan hệ (như pixel). Với dữ liệu bảng, thứ tự cột là tuỳ ý — giả định này sai hoàn toàn."},
{name:"Cây (Random Forest / LightGBM / XGBoost)", v:"warn", why:"Rất mạnh trên dữ liệu bảng — thực tế LightGBM <em>thắng</em> FT-Transformer ở GĐ1. Nhưng cây học tương tác bằng cách chẻ nhánh liên tiếp, kém khi tương tác liên tục và mượt. Kết luận: <strong>không loại bỏ mà kết hợp</strong> — chúng vào ensemble ở GĐ1 (Stacking) và GĐ2 (RF/KNN vote)."},
{name:"Multi-Head Self-Attention (8 đầu)", v:"ok", why:"Học tương tác cặp trực tiếp, cho ma trận attention giải thích được, và là kiến trúc SOTA cho dữ liệu bảng tại thời điểm làm đồ án."}]
});

T.push({
id:"transformer-block", phase:"gd1", tag:"Kiến trúc · 3/3", title:"Transformer Block: Pre-Norm + GEGLU + LayerScale + DropPath",
one:"Bốn chi tiết nhỏ giữ cho mạng 4 tầng huấn luyện ổn định và không overfit lớp hiếm.",
why:`<p>Attention chỉ là một nửa. Nửa còn lại là khối FFN xử lý từng token, cộng với các cơ chế giữ cho việc huấn
luyện không nổ hoặc không chết. Trên dữ liệu cực lệch, mạng rất dễ overfit vài trăm mẫu lớp hiếm — nên phần
regularization ở đây <strong>không phải trang trí</strong>.</p>`,
how:`<p><strong>Pre-Norm</strong> — chuẩn hoá <em>trước</em> khi vào Attention/FFN (<code>x + f(norm(x))</code>) chứ
không phải sau. Giữ đường residual sạch → gradient chảy thẳng từ tầng cuối về tầng đầu, huấn luyện ổn định hơn.</p>
<p><strong>GEGLU</strong> — thay vì <code>ReLU(xW)</code>, chia đầu ra thành hai nửa, một nửa làm <em>nội dung</em>,
nửa kia làm <em>cổng</em>:</p>
<div class="formula">GEGLU(x) = a ⊗ GELU(b),   trong đó [a, b] = split(xW)</div>
<p><strong>LayerScale</strong> — nhân đầu ra mỗi nhánh với hệ số γ học được, khởi tạo rất nhỏ (1e-4). Ban đầu mạng
gần như là identity, rồi tự "mở van" dần → mạng sâu hội tụ được.</p>
<p><strong>DropPath (Stochastic Depth)</strong> — khi huấn luyện, ngẫu nhiên bỏ nguyên cả nhánh residual của một
tầng. Mạnh hơn Dropout: nó buộc mạng không phụ thuộc vào bất kỳ tầng đơn nào.</p>`,
code:[{file:"live_detection/model_defs/phase2_ft_transformer_v2.py", lines:"131–158",
snippet:`class TransformerBlock(nn.Module):
    def __init__(self, d_model, num_heads, d_ff, dropout=0.1, drop_path=0.0):
        self.norm1, self.attn = nn.LayerNorm(d_model), MultiHeadSelfAttention(...)
        self.drop_path1 = DropPath(drop_path) if drop_path > 0. else nn.Identity()
        # LayerScale parameters — khởi tạo nhỏ, mạng tự "mở van"
        self.gamma1 = nn.Parameter(1e-4 * torch.ones(d_model))
        self.gamma2 = nn.Parameter(1e-4 * torch.ones(d_model))
        # GEGLU nhân đôi đầu ra trước khi chunk, nên Linear đầu tiên cần * 2 d_ff
        self.ffn = nn.Sequential(nn.Linear(d_model, d_ff * 2), GEGLU(),
                                 nn.Dropout(dropout), nn.Linear(d_ff, d_model))

    def forward(self, x):
        x = x + self.drop_path1(self.gamma1 * self.attn(self.norm1(x)))   # Pre-Norm
        x = x + self.drop_path2(self.gamma2 * self.ffn(self.norm2(x)))
        return x`,
note:"Bốn kỹ thuật cùng nằm trên một dòng forward: Pre-Norm (norm trước attn), LayerScale (gamma), DropPath, residual."},
{file:"live_detection/model_defs/phase2_ft_transformer_v2.py", lines:"181",
snippet:`# DropPath scheduling (tăng dần theo chiều sâu mạng)
dpr = [x.item() for x in torch.linspace(0, drop_path_rate, num_layers)]`,
note:"Tầng đầu gần như không bị drop (0), tầng cuối drop mạnh nhất (0.15) — tầng sâu chuyên biệt hơn nên dễ overfit hơn."}],
alts:[
{name:"Post-Norm (Transformer gốc 2017)", v:"no", why:"Norm nằm trên đường residual → gradient bị bóp qua từng tầng, cần warmup rất cẩn thận mới hội tụ. Pre-Norm ổn định hơn hẳn với mạng sâu."},
{name:"FFN với ReLU / GELU thường", v:"no", why:"Không có cơ chế cổng. GEGLU cho mạng tự quyết định thông tin nào được đi qua, đổi lại chỉ tốn thêm một nửa tham số ở Linear đầu."},
{name:"Chỉ dùng Dropout", v:"no", why:"Dropout tắt <em>đơn vị</em>; DropPath tắt <em>cả tầng</em>. Với chỉ vài trăm mẫu Web Attack, regularization cấp tầng cần thiết hơn. Thực tế code dùng <strong>cả hai</strong>: dropout=0.15 và drop_path=0.15."},
{name:"Pre-Norm + GEGLU + LayerScale + DropPath", v:"ok", why:"Bộ tứ chuẩn của FT-Transformer V2; giữ mạng 4 tầng huấn luyện ổn định trên dữ liệu lệch 164:1 mà không cần warmup phức tạp."}]

dài lê thê.</p>
<p>Với phân phối như vậy, StandardScaler vô dụng: nó trừ mean chia std, nhưng mean và std đều bị vài giá trị
ngoại lai kéo lệch. Sau khi scale, 99% dữ liệu vẫn chen chúc trong một khoảng cực hẹp → mạng nơ-ron không phân

<div class="formula">x ≥ 0:  ψ(x,λ) = ((x+1)^λ − 1) / λ        (λ ≠ 0)
x &lt; 0:  ψ(x,λ) = −((−x+1)^(2−λ) − 1) / (2−λ)</div>

T.push({
id:"cross-entropy", phase:"gd2", tag:"Hàm mất mát · nền", title:"Cross-Entropy và vì sao nó thất bại trên dữ liệu lệch",
one:"CE cộng đều mọi mẫu, nên 91.600 mẫu DoS 'dễ' át hoàn toàn 442 mẫu PortScan 'khó'.",
why:`<p>Đây là điểm khởi đầu — phải hiểu CE hỏng chỗ nào thì mới hiểu vì sao cần Focal Loss.</p>
<p>CE phạt model theo mức độ nó gán xác suất thấp cho nhãn đúng. Vấn đề không nằm ở công thức, mà ở phép
<strong>cộng dồn</strong>: gradient tổng của một batch là tổng gradient của từng mẫu. Một mẫu DoS mà model đã đoán
đúng với p = 0,95 vẫn đóng góp một chút gradient — nhân với hàng nghìn mẫu như thế, phần đóng góp "vụn" ấy
lấn át hoàn toàn gradient của vài mẫu lớp hiếm.</p>`,
how:`<div class="formula">L_CE = − Σ_c y_c · log(p_c)  =  − log(p_t)      (với nhãn one-hot, p_t = xác suất lớp đúng)</div>
<p>Ví dụ số: batch có 1000 mẫu Benign (p_t = 0,95) và 10 mẫu Brute Force (p_t = 0,40).</p>
<ul>
<li>Benign: 1000 × (−log 0,95) ≈ 1000 × 0,051 = <strong>51,3</strong></li>
<li>Brute Force: 10 × (−log 0,40) ≈ 10 × 0,916 = <strong>9,2</strong></li>
</ul>
<p>Lớp đông đóng góp gấp <strong>5,6 lần</strong> — dù model đã làm tốt lớp đó rồi. Model sẽ tiếp tục dồn sức
"tối ưu cái đã đúng".</p>`,
code:[{file:"CIC_IDS_2017_Workspace/src/training/scripts_v7/phase2_train_v7_stage2_ensemble.py", lines:"37–45",
snippet:`class FocalLoss(nn.Module):
    def __init__(self, weight=None, gamma=1.5, label_smoothing=0.0):
        # CE vẫn là lõi — Focal Loss chỉ bọc thêm hệ số điều biến lên trên
        self.ce = nn.CrossEntropyLoss(weight=weight,
                                      label_smoothing=label_smoothing,
                                      reduction='none')
    def forward(self, inputs, targets):
        ...`,
note:"Chú ý <code>reduction='none'</code>: phải giữ loss <em>từng mẫu</em> thì mới nhân được hệ số Focal riêng cho từng mẫu. Nếu để mặc định <code>'mean'</code> thì Focal Loss không cài được."}],
alts:[
{name:"Cross-Entropy thuần", v:"no", why:"Không có cơ chế nào phân biệt mẫu dễ với mẫu khó. Trên tỉ lệ 164:1, lớp hiếm bị nhấn chìm — đây là triệu chứng đã đo được, không phải suy đoán."},
{name:"Cross-Entropy + trọng số lớp", v:"warn", why:"Cải thiện nhưng chưa đủ: nó cân theo <em>lớp</em>, không phân biệt được mẫu <em>khó</em> với mẫu <em>dễ</em> <strong>trong cùng một lớp</strong>. Vẫn được dùng — nhưng dùng <em>kèm</em> Focal, không thay thế."},
{name:"Cross-Entropy làm lõi cho Focal Loss", v:"ok", why:"CE không bị vứt bỏ mà được bọc lại: <code>L_FL = (1−p_t)^γ · L_CE</code>. Giữ mọi tính chất tốt về gradient của CE, thêm cơ chế hạ trọng số mẫu dễ."}]
});

T.push({
id:"focal-loss", phase:"gd2", tag:"Hàm mất mát", title:"Focal Loss — vặn nhỏ tiếng mẫu dễ",
one:"Nhân CE với (1−p_t)^γ: mẫu model đã đoán chắc thì gần như im tiếng, mẫu còn khó thì vẫn nói to.",
why:`<p>Giải trực tiếp bệnh của Cross-Entropy: lớp đông át gradient <strong>không phải vì nó đông</strong>, mà vì các
mẫu của nó <em>đã dễ</em> mà vẫn tiếp tục đóng góp gradient. Vậy thì hãy bịt miệng những mẫu đã dễ.</p>`,
how:`<div class="formula">L_FL = − α_t · (1 − p_t)^γ · log(p_t)</div>
<ul>
<li><code>(1−p_t)^γ</code> — <strong>hệ số điều biến</strong>. Mẫu dễ (p_t → 1) → hệ số teo về 0.
Mẫu khó (p_t nhỏ) → hệ số giữ gần 1.</li>
<li><code>γ</code> — nút vặn. γ = 0 quay về CE. Đồ án dùng <strong>γ = 1,5</strong> ở GĐ2 và <strong>γ = 2,0</strong>
ở GĐ3/GĐ5.</li>
<li><code>α_t</code> — trọng số theo lớp, chồng thêm lên (xem mục Trọng số lớp).</li>
</ul>
<p>Với γ = 2, mẫu Benign p_t = 0,95 bị nhân hệ số 0,05² = 0,0025 → gradient giảm <strong>400 lần</strong>.
Ví dụ ở mục Cross-Entropy bị đảo ngược: từ chỗ Benign áp đảo 5,6:1 thành Brute Force áp đảo ~25:1.</p>`,
code:[{file:"live_detection/training/v8_7_train_realbenign.py", lines:"79–91, 264",
snippet:`class FocalLoss(nn.Module):
    def __init__(self, gamma=2.0, weight=None, label_smoothing=0.10):
        self.gamma = gamma
        ...
    def forward(self, inputs, targets):
        ce = F.cross_entropy(inputs, targets, weight=self.weight,
                             reduction='none', label_smoothing=self.label_smoothing)
        pt = torch.exp(-ce)                       # p_t suy ra từ CE
        return (((1 - pt) ** self.gamma) * ce).mean()

...
criterion = FocalLoss(gamma=2.0, weight=cw, label_smoothing=0.10)`,
note:"<code>pt = torch.exp(-ce)</code> là mẹo cài đặt gọn: vì <code>ce = −log(p_t)</code> nên <code>exp(−ce) = p_t</code>. Ba cơ chế chồng lên nhau trong một dòng: Focal (gamma) + trọng số lớp (weight) + Label Smoothing."}],
alts:[
{name:"Cross-Entropy", v:"no", why:"Không phân biệt mẫu dễ/khó — xem mục riêng."},
{name:"Class-Balanced Focal (trọng số theo 'số mẫu hiệu dụng')", v:"warn", why:"Tinh vi hơn: dùng <code>(1−β)/(1−β^n)</code> thay vì 1/n, vì các mẫu lớp đông trùng lặp nhiều nên 'số mẫu hiệu dụng' thấp hơn số mẫu thật. Đã cân nhắc; code cuối cùng dùng <code>compute_class_weight('balanced')</code> vì đơn giản hơn và cho kết quả tương đương trên bộ này."},
{name:"Chỉ dùng trọng số lớp", v:"no", why:"Cân theo lớp nhưng không cân theo độ khó — một mẫu DoS dễ và một mẫu DoS khó vẫn cùng trọng số."},
{name:"Focal Loss (γ=1.5 ở GĐ2, γ=2.0 ở GĐ3/5) + trọng số lớp", v:"ok", why:"Chồng cả hai cơ chế: cân giữa các lớp (α) và cân giữa mẫu dễ/khó trong cùng lớp (γ)."}],
ev:[["400×","mức giảm gradient của mẫu Benign đã đoán chắc (p_t = 0,95, γ = 2)"],
["7,5% → 6,8%","PortScan F1 khi thêm Focal Loss — <strong>không cải thiện</strong>"]],
gap:`<strong>Giới hạn phải nói ra:</strong> Focal Loss giả định hai lớp <em>có thể phân tách được</em>, chỉ là lớp
đông át gradient. Khi hai lớp <strong>chồng lên nhau trong không gian đặc trưng</strong> — đúng trường hợp PortScan
vs Benign dưới NAT — Focal Loss bó tay: không có ranh giới nào để học tốt hơn dù vặn γ kiểu gì. Bằng chứng:
PortScan F1 <strong>7,5% → 6,8%</strong>. Đây là lý do PortScan cuối cùng phải giải bằng <em>luật</em>, không phải
bằng loss.`
});

mask_low_prob = (s1_preds == suspicious_idx) & (s1_probs < THRESHOLD)

note:"Ngưỡng của cổng gating là một nút vặn đánh đổi trực tiếp: hạ ngưỡng → nhiều flow lên tầng 2 → recall cao, tốn tính toán; nâng ngưỡng → ngược lại."}],
codeOutro:`<p><strong>Điểm quan trọng cho GĐ5:</strong> hệ thống live hiện tại <em>không</em> dùng cascade — nó dùng
một model V8.5 phẳng 5 lớp. Lý do: sau GĐ3, số lớp giảm từ 9 xuống 5 và bài toán mất cân bằng được giải bằng
loss + luật hậu xử lý, nên thêm một tầng gating chỉ làm tăng độ trễ và thêm chỗ hỏng cho pipeline realtime.
Cascade là thành tựu của GĐ2, không phải kiến trúc cuối cùng.</p>`,

{name:"Một model phẳng 9 lớp", v:"no", why:"Phải học đồng thời hai nhiệm vụ khó khác nhau dưới một hàm mất mát, và chịu mất cân bằng toàn cục. Đây chính là baseline mà cascade đánh bại ở GĐ2."},
{name:"Autoencoder làm cổng (học Benign, dùng lỗi tái tạo)", v:"no", why:"Cổng không giám sát: học nén flow Benign, flow nào tái tạo lỗi lớn thì bất thường. Hấp dẫn vì bắt được zero-day, nhưng ngưỡng lỗi tái tạo cực nhạy với domain shift — mà shift chính là vấn đề lớn nhất của đồ án (GĐ3). Không chọn."},
{name:"Cascade Gating + Expert", v:"ok", why:"Mỗi tầng một nhiệm vụ, tập vào tầng 2 cân bằng hơn, và tiết kiệm tính toán trên 99% traffic bình thường."}],

T.push({
id:"inductive-bias", phase:"gd2", tag:"Ensemble", title:"Đa dạng inductive bias — FTT + Random Forest + KNN",
one:"Ensemble chỉ có giá trị khi các thành viên sai KHÁC nhau. Ba họ thuật toán khác nhau đảm bảo điều đó.",
why:`<p>Trung bình cộng của N model giảm phương sai theo hệ số N <strong>chỉ khi</strong> lỗi của chúng độc lập.
Nếu ba model cùng sai một chỗ, ensemble không giúp gì — chỉ tốn gấp ba lần tính toán.</p>
<p>Vậy làm sao ép chúng sai khác nhau? Câu trả lời: cho chúng <strong>giả định khác nhau về thế giới</strong>
(inductive bias). Ba model cùng là FT-Transformer chỉ khác seed vẫn có cùng thiên kiến — chúng sẽ sai giống nhau.</p>`,
how:`<p>Ba họ thuật toán với ba giả định hoàn toàn khác:</p>
<ul>
<li><strong>FT-Transformer</strong> — giả định: nhãn phụ thuộc vào <em>tương tác</em> giữa các đặc trưng, và ranh
giới là một mặt cong mượt trong không gian 80 chiều.</li>
<li><strong>Random Forest</strong> — giả định: ranh giới có thể xấp xỉ bằng các <em>lát cắt vuông góc trục</em>
("nếu Flow_Duration > 5000 VÀ SYN_Count > 3 thì…"). Rất mạnh khi ranh giới thật đúng là dạng ngưỡng.</li>
<li><strong>KNN</strong> — giả định: <em>không có</em> ranh giới toàn cục nào cả, chỉ có "giống hàng xóm nào thì
là loại đó". Model phi tham số, bắt được các cụm nhỏ lẻ mà hai model kia làm mượt mất.</li>
</ul>
<p>Ba giả định này sai ở những vùng khác nhau của không gian đặc trưng → lỗi ít tương quan → ensemble thực sự có lãi.</p>`,
code:[{file:"CIC_IDS_2017_Workspace/src/training/scripts_v7/phase2_train_v7_stage2_ensemble.py", lines:"237, 242",
snippet:`rf_model = RandomForestClassifier(n_estimators=150, max_features=20, max_depth=25,
                                  random_state=42, n_jobs=-1, class_weight='balanced')
...
knn_model = KNeighborsClassifier(n_neighbors=16, n_jobs=-1)`,
note:"RF cũng dùng <code>class_weight='balanced'</code> — cùng triết lý xử lý mất cân bằng như Focal Loss bên phía mạng nơ-ron. Cả ba model đều ăn cùng một <code>X_s2_scaled</code>, nên chỉ khác nhau ở inductive bias chứ không khác ở dữ liệu."}],
alts:[
{name:"Bagging cùng một kiến trúc (N × FT-Transformer khác seed)", v:"no", why:"Cùng inductive bias → lỗi tương quan cao → ensemble giảm phương sai rất ít. Tốn N lần tính toán để đổi lấy cải thiện không đáng kể."},
{name:"Boosting (XGBoost/LightGBM nối tiếp)", v:"warn", why:"Rất mạnh nhưng giảm <em>bias</em> chứ không giảm <em>variance</em>, và các cây phụ thuộc nhau nên không tạo được sự đa dạng cần cho voting. Đã dùng ở GĐ1 (LightGBM trong Stacking) — ở đó nó là thành viên, không phải cơ chế ensemble."},
{name:"Chỉ dùng FT-Transformer (bỏ ensemble)", v:"no", why:"FTT một mình <em>tự tin sai</em> ở lớp Bot: nhiều flow Benign bị gán Bot với xác suất cao. RF và KNN với giả định khác nhìn ra ngay — đó là lý do sinh ra luật Botnet Consensus."},
{name:"FTT + Random Forest + KNN", v:"ok", why:"Ba họ thuật toán, ba giả định, lỗi ít tương quan. Và quan trọng: RF/KNN rẻ, chạy trên tập đã lọc bởi tầng gating nên không làm chậm hệ thống."}]
});

T.push({
id:"asymmetric-voting", phase:"gd2", tag:"Ensemble", title:"Voting bất đối xứng — vì chi phí sai không đối xứng",
one:"Bỏ sót tấn công và báo giả không có cùng giá. Vậy tại sao luật vote lại đối xứng?",
why:`<p>Bỏ phiếu đa số ngầm giả định: mọi loại sai đều tệ như nhau. Trong an ninh mạng điều đó <strong>sai hiển
nhiên</strong>:</p>
<ul>
<li>Bỏ sót một cuộc <strong>Infiltration</strong> (kẻ tấn công đã vào trong mạng) = thảm hoạ. Sai lầm này phải
tránh bằng mọi giá.</li>
<li>Báo giả một flow Benign thành <strong>Bot</strong> = nhân viên vận hành mất thời gian, và nếu nhiều quá thì
họ sẽ tắt hệ thống — cũng là thảm hoạ, chỉ chậm hơn.</li>
</ul>
<p>Hai loại sai này cần <strong>hai chính sách vote khác nhau</strong>.</p>`,
how:`<p>Ba luật, cố ý bất đối xứng:</p>
<ul>
<li><strong>Ưu tiên Infiltration</strong> — <em>bất kỳ</em> model nào (RF hoặc KNN) hô Infiltration là chốt
Infiltration. Đây là vote kiểu "OR" — cực kỳ dễ kích hoạt, vì thà báo thừa còn hơn bỏ sót.</li>
<li><strong>Đồng thuận Botnet</strong> — FTT hô Bot nhưng <em>chỉ cần một</em> model khác nói Benign là hạ về
Benign. Vote kiểu "AND" — cực kỳ khó kích hoạt, vì FTT nổi tiếng báo giả Bot.</li>
<li><strong>Ngưỡng mềm cho phần còn lại</strong> — tin FTT nếu xác suất ≥ 0,65, không thì Benign.</li>
</ul>`,
code:[{file:"CIC_IDS_2017_Workspace/src/training/scripts_v7/evaluate_cascade_system_v7.py", lines:"186–199",
snippet:`for j in range(len(ft)):
    if ft[j] == 'Benign':
        stage2_final[j] = 'Benign'
    else:
        # 1. Infiltration Priority — chỉ cần MỘT phiếu là đủ (chống bỏ sót)
        if rf[j] == 'Infiltration' or knn[j] == 'Infiltration' \\
           or (ft[j] == 'Infiltration' and ft_prob[j] >= inf_thresh):
            stage2_final[j] = 'Infiltration'
        # 2. Botnet Consensus — chỉ cần MỘT phiếu phản đối là bác (chống báo giả)
        elif ft[j] == 'Bot' and (rf[j] == 'Benign' or knn[j] == 'Benign'):
            stage2_final[j] = 'Benign'
        # 3. Ngưỡng mềm cho các lớp còn lại
        elif ft_prob[j] >= 0.65:
            stage2_final[j] = ft[j]
        else:
            stage2_final[j] = 'Benign'`,
note:"Đọc kỹ luật 1 và luật 2: chúng <strong>ngược chiều nhau</strong> một cách có chủ ý. Luật 1 tối đa hoá recall cho lớp nguy hiểm nhất; luật 2 tối đa hoá precision cho lớp hay báo giả nhất. Đây là ma trận chi phí được mã hoá thẳng thành <code>if/elif</code>."}],
alts:[
{name:"Bỏ phiếu đa số (majority vote)", v:"no", why:"Đối xứng — coi bỏ sót Infiltration ngang với báo giả Bot. Không phản ánh được chi phí thật của bài toán an ninh."},
{name:"Soft voting (trung bình xác suất)", v:"no", why:"Cũng đối xứng, và còn tệ hơn ở chỗ RF/KNN cho xác suất kém hiệu chuẩn nên trung bình cộng bị nhiễu."},
{name:"Học ma trận chi phí bằng meta-learner (như Stacking GĐ1)", v:"warn", why:"Về nguyên tắc đẹp hơn, nhưng cần một tập val đủ lớn cho <em>từng lớp hiếm</em> — với Infiltration chỉ có vài chục mẫu thì meta-learner sẽ học nhiễu. Luật viết tay dựa trên hiểu biết miền đáng tin hơn ở quy mô này."},
{name:"Luật vote bất đối xứng viết tay", v:"ok", why:"Mã hoá trực tiếp chi phí sai thật của bài toán, đọc được và bảo vệ được trước hội đồng, không cần thêm dữ liệu."}]
});

T.push({
id:"hard-negative-mining", phase:"gd2", tag:"Chiến lược dữ liệu", title:"Hard Negative Mining — bắt model học lại đúng chỗ nó sai",
one:"Thay vì cho model xem thêm dữ liệu ngẫu nhiên, nhân bản đúng những mẫu Benign mà nó từng báo giả.",
why:`<p>Model V5 có một tật cụ thể: nó gán nhãn <strong>Bot</strong> cho nhiều flow thực ra là Benign. Cho nó học
thêm 500.000 flow Benign ngẫu nhiên gần như vô ích — 99% trong số đó là những flow Benign "dễ" mà model đã phân
loại đúng từ lâu. Gradient từ chúng bằng 0.</p>
<p>Cái model cần là những mẫu Benign nằm <strong>sát ranh giới quyết định</strong> — chính là những mẫu nó đang sai.</p>`,
how:`<p>Quy trình ba bước:</p>
<ul>
<li>Chạy model hiện tại lên toàn bộ tập train, thu lại các flow có nhãn thật = Benign nhưng bị dự đoán = Bot.
Đây là tập <em>hard negative</em>.</li>
<li>Dựng tập train mới = một lượng vừa phải Benign "dễ" (giữ phân phối) + tập hard negative được
<strong>nhân bản 10 lần</strong>.</li>
<li>Train lại. Gradient giờ tập trung vào đúng vùng ranh giới đang hỏng.</li>
</ul>`,
code:[{file:"CIC_IDS_2017_Workspace/src/training/scripts_v7/extract_hard_negatives_v7.py", lines:"129–148",
snippet:`# Tìm tập Botnet FP: Label thực tế là Benign, nhưng Stage 2 V5 dự đoán là Bot
df_botnet_fp = ...

df_easy_benign = df_full[(df_full['Pred_Stage1'] != suspicious_idx)
                         & (df_full['Label_Stage2_V7'] == 'Benign')]
num_easy = min(50000, len(df_easy_benign))
df_easy_benign = df_easy_benign.sample(n=num_easy, random_state=42)

df_new = pd.concat([
    df_easy_benign,
    *[df_botnet_fp] * 10          # Nhân bản 10 lần Botnet FP
])`,

codeOutro:`<p>Cùng một triết lý được dùng lại ở <strong>GĐ5, Bước 5</strong>, ở quy mô lớn hơn nhiều: model V8.5 báo
giả 24,26% trên benign thật → thu 40.000 flow benign <em>thật</em> (chứ không phải benign từ CIC-IDS-2017) và
fine-tune. Kết quả: FPR rơi xuống 0,29%. Về bản chất, đó chính là hard negative mining ở cấp <em>miền dữ liệu</em>.</p>`,
alts:[
{name:"Thêm dữ liệu Benign ngẫu nhiên", v:"no", why:"Phần lớn là mẫu dễ, gradient ≈ 0 → tốn thời gian train mà không sửa được ranh giới."},
{name:"Chỉ tăng trọng số lớp Benign trong loss", v:"no", why:"Tăng đều cho <em>mọi</em> mẫu Benign, kể cả hàng trăm nghìn mẫu đã đúng → làm lệch model sang Benign nói chung, hi sinh recall tấn công."},
{name:"Online Hard Example Mining (chọn mẫu khó ngay trong mỗi batch)", v:"no", why:"Tinh vi hơn nhưng dễ bị nhiễu nhãn kéo đi: nếu tập train có nhãn sai, OHEM sẽ dồn toàn lực học chính những nhãn sai đó. Khai thác offline cho phép kiểm tra bằng mắt trước khi đưa vào."},
{name:"Khai thác offline + nhân bản 10× mẫu báo giả", v:"ok", why:"Kiểm soát được (nhìn tận mắt tập hard negative), đơn giản, và nhắm đúng vùng ranh giới đang hỏng."}],

T.push({
id:"ema-schedule", phase:"gd2", tag:"Tối ưu hoá", title:"EMA + Warmup-Cosine — làm mượt quá trình huấn luyện",
one:"Lấy trung bình trượt trọng số qua các bước, và cho learning rate khởi động chậm rồi tắt dần theo hình cosin.",
why:`<p>SGD/AdamW nhảy quanh cực tiểu chứ không đứng yên ở đó. Trọng số ở bước cuối cùng chỉ là một điểm ngẫu nhiên
trong vùng dao động — không nhất thiết là điểm tốt nhất.</p>
<p>Đồng thời, learning rate lớn ngay từ bước đầu (khi trọng số còn ngẫu nhiên) dễ đẩy model vào vùng tồi và không
quay ra được — đặc biệt với Transformer, vốn nổi tiếng nhạy với warmup.</p>`,
how:`<p><strong>EMA (Exponential Moving Average)</strong> — giữ một bản sao trọng số được cập nhật trượt:</p>
<div class="formula">θ_EMA ← decay · θ_EMA + (1 − decay) · θ        (decay = 0,999)</div>
<p>Bản sao này nằm ở "tâm" của vùng dao động → thường tổng quát hoá tốt hơn trọng số tức thời.</p>
<p><strong>Warmup + Cosine Annealing</strong> — learning rate tăng tuyến tính từ 0 trong vài epoch đầu (warmup),
rồi giảm theo hình cosin về gần 0 ở cuối. Cuối quá trình, bước nhảy nhỏ dần → model "hạ cánh" êm vào cực tiểu
thay vì tiếp tục nhảy quanh.</p>`,
code:[{file:"CIC_IDS_2017_Workspace/src/training/scripts_v7/phase2_train_v7_stage2_ensemble.py", lines:"47–72",
snippet:`class WarmupCosineSchedule(_LRScheduler):
    def __init__(self, optimizer, warmup_epochs, total_epochs, min_lr=1e-6, ...):
        ...

class ModelEMA:
    def __init__(self, model, decay=0.999):
        ...
    def update(self, model):
        # θ_EMA ← 0.999·θ_EMA + 0.001·θ`,
note:"decay = 0,999 nghĩa là bản EMA nhớ khoảng 1000 bước gần nhất."},
{file:"live_detection/training/v8_7_train_realbenign.py", lines:"265–266",
snippet:`optimizer = torch.optim.AdamW(param_groups, weight_decay=2e-4)
scheduler = torch.optim.lr_scheduler.CosineAnnealingLR(optimizer, T_max=EPOCHS)`,
note:"Ở GĐ3/GĐ5 giữ Cosine Annealing nhưng <strong>bỏ warmup và bỏ EMA</strong> — vì đây là <em>fine-tune</em> từ trọng số đã tốt, không phải train từ đầu: không có giai đoạn 'trọng số ngẫu nhiên' để cần warmup bảo vệ."}],
alts:[
{name:"Learning rate cố định", v:"no", why:"Không hạ cánh được: đến cuối quá trình model vẫn nhảy quanh cực tiểu với bước nhảy nguyên như ban đầu."},
{name:"Step decay (giảm LR theo bậc thang)", v:"no", why:"Mỗi lần rơi bậc là một cú sốc cho quá trình tối ưu. Cosine giảm liên tục, mượt hơn."},
{name:"ReduceLROnPlateau", v:"warn", why:"Thích ứng theo validation — hợp lý, nhưng phụ thuộc vào độ nhiễu của chỉ số val. Với lớp hiếm chỉ vài trăm mẫu, val Macro-F1 dao động mạnh → scheduler sẽ giảm LR vì nhiễu chứ không vì hội tụ."},
{name:"AdamW + Warmup-Cosine + EMA (GĐ2) / AdamW + Cosine (GĐ3, GĐ5)", v:"ok", why:"Train-from-scratch cần warmup và EMA; fine-tune thì không — dùng đúng công cụ cho đúng tình huống thay vì bê nguyên cấu hình."}]
});

T.push({
id:"covariate-shift", phase:"gd3", tag:"Chẩn đoán · 1", title:"Covariate Shift — cùng một nhãn, khác một thế giới",
one:"P(y|x) không đổi, nhưng P(x) đổi. Model học đúng quy luật, chỉ là quy luật ấy được đo trong một thế giới khác.",
why:`<p>Model V4 đạt 99% trên CIC-IDS-2017. Đem sang testbed WSL2 thật thì sập. Nhưng "DoS vẫn là DoS" — định
nghĩa tấn công không hề thay đổi. Vậy cái gì đổi?</p>
<p><strong>Phân phối đầu vào đổi.</strong> CIC-IDS-2017 thu năm 2017 trên mạng vật lý thật: có độ trễ mạng, có
MTU chuẩn, gói đi qua switch. Testbed chạy trên WSL2 năm 2026: loopback ảo, độ trễ gần bằng 0, MTU khác, và
traffic đi qua NAT. Cùng một cuộc tấn công DoS cho ra những con số hoàn toàn khác.</p>`,
how:`<div class="formula">P_train(x) ≠ P_test(x)      nhưng      P_train(y|x) = P_test(y|x)</div>
<p>Đây là <em>covariate shift</em> — khác với <em>concept drift</em> (khi chính định nghĩa nhãn đổi). Tin tốt: quy
luật vẫn còn đó, nên có thể cứu được. Tin xấu: model đã học các ranh giới quyết định <strong>được đo bằng thang đo
của miền cũ</strong>, và giờ dữ liệu rơi vào những vùng nó chưa từng thấy.</p>
<p>Đo lệch bằng <strong>KS-test</strong> (Kolmogorov–Smirnov) trên từng đặc trưng: so hàm phân phối tích luỹ của
lab và của thật, lấy khoảng cách lớn nhất.</p>`,

id:"scaler-coupling", phase:"gd3", tag:"Chẩn đoán · 2 · kết quả âm", title:"Vì sao fit lại scaler trên miền mới lại PHÁ HUỶ model",
one:"Cách rẻ nhất để chữa domain shift, và nó thất bại — nhưng chính thất bại này giải thích toàn bộ thiết kế sau đó.",
why:`<p>Suy nghĩ đầu tiên, hoàn toàn tự nhiên: "phân phối đầu vào đổi → fit lại scaler trên dữ liệu mới là xong,
không cần train lại gì cả." Rẻ, nhanh, hợp lý.</p>
<p>Kết quả: <strong>model sập</strong>. Và hiểu ra vì sao mới là phần có giá trị nhất của GĐ3.</p>`,
how:`<p>Điểm mấu chốt: <strong>scaler và trọng số embedding là một cặp bị khoá vào nhau</strong>.</p>
<p>Feature Tokenizer học <code>token_j = x_j · W_j + b_j</code>. Trọng số W_j được học <em>với giả định rằng
x_j đã được scale bằng scaler cũ</em>. Ví dụ: <code>Flow_Duration</code> sau scaler CIC-IDS-2017 có mean 0, std 1
— và W_j được điều chỉnh cho đúng thang đo đó.</p>
<p>Khi fit lại scaler trên testbed, cùng một <code>Flow_Duration</code> = 5000 µs giờ được ánh xạ sang một giá trị
scaled <em>hoàn toàn khác</em> (vì mean/std/λ của testbed khác). W_j vẫn nguyên si nhưng đầu vào của nó đã đổi
nghĩa → toàn bộ token sai → mọi tầng sau sai theo.</p>
<div class="formula">Đổi scaler mà không đổi W  ⇔  đổi đơn vị đo mà không đổi công thức
(giống như đưa số đo tính bằng mét vào công thức viết cho centimet)</div>`,

snippet:`print("[*] Re-fitting PowerTransformer trên Testbed Data...")

X_scaled = scaler.fit_transform(X_raw)      # ← FIT LẠI trên miền mới

# ... nạp model gốc CIC-IDS-2017, giữ nguyên trọng số ...

print("KẾT QUẢ SAU KHI RE-FIT SCALER")
acc = accuracy_score(y_true, y_pred_binary)`,

codeOutro:`<p>Hệ quả trực tiếp cho toàn bộ thiết kế về sau — <strong>một ràng buộc sắt</strong>: nếu muốn giữ trọng số

T.push({
id:"layer-freezing", phase:"gd3", tag:"Học chuyển giao", title:"Layer Freezing — chống quên thảm hoạ",
one:"Đóng băng tầng đầu (tri thức chung), chỉ cho tầng cuối học lại (tri thức chuyên biệt miền).",
why:`<p>Testbed có ít dữ liệu hơn CIC-IDS-2017 hàng chục lần. Fine-tune toàn bộ mạng trên tập nhỏ ấy sẽ gây
<strong>catastrophic forgetting</strong> (quên thảm hoạ): gradient từ vài nghìn mẫu mới sẽ ghi đè lên tri thức
đã học từ 2,8 triệu mẫu cũ. Model quên mất DoS trông như thế nào nói chung, chỉ còn nhớ DoS trên WSL.</p>
<p>Nhưng không phải tầng nào cũng cần học lại. Trong mạng sâu có một sự phân công tự nhiên:</p>
<ul>
<li><strong>Tầng đầu</strong> học biểu diễn <em>chung</em>, ít phụ thuộc miền ("gói nhỏ + gửi nhanh").</li>
<li><strong>Tầng cuối</strong> học tổ hợp <em>chuyên biệt</em>, gắn chặt với miền ("với đặc điểm mạng này thì
tổ hợp đó nghĩa là DoS").</li>
</ul>`,
how:`<p>Đóng băng = đặt <code>requires_grad = False</code> → tham số không nhận gradient, optimizer không đụng tới.
Chỉ 2 khối Transformer cuối và bộ phân lớp được học lại, với learning rate <strong>rất nhỏ</strong> (1e-5) để
tránh phá vỡ trọng số cũ.</p>`,
code:[{file:"Domain_Adaptation_Workspace/scripts/2_finetune_freeze.py", lines:"224–237, 252",
snippet:`for param in model.feature_embedding.parameters():
    param.requires_grad = False
for param in model.transformer_blocks[0].parameters():
    param.requires_grad = False
for param in model.transformer_blocks[1].parameters():
    param.requires_grad = False

# Unfreeze 2 khối cuối và classifier
for param in model.transformer_blocks[2].parameters():
    param.requires_grad = True
for param in model.transformer_blocks[3].parameters():
    param.requires_grad = True
for param in model.classifier.parameters():
    param.requires_grad = True

optimizer = torch.optim.AdamW(
    filter(lambda p: p.requires_grad, model.parameters()),   # chỉ tối ưu phần chưa đóng băng
    lr=1e-5, weight_decay=1e-4)`,
note:"<code>filter(lambda p: p.requires_grad, ...)</code> — bắt buộc. Nếu truyền toàn bộ tham số vào optimizer, AdamW vẫn sẽ áp weight decay lên cả tham số đã đóng băng và làm chúng trôi dần về 0."}],
codeOutro:`<p><strong>Nhưng đến GĐ5 thì freezing bị bỏ.</strong> Cả <code>v8_5_train.py</code> lẫn
<code>v8_7_train_realbenign.py</code> đều <em>full unfreeze</em> — lý do: lúc này đã có <strong>63.401 flow benign
thật</strong> chứ không còn 37 flow. Đủ dữ liệu thì không còn phải sợ quên thảm hoạ, và cho toàn mạng học lại sẽ
thích nghi tốt hơn. Bù lại, dùng <strong>learning rate phân tầng</strong> (tầng sâu học chậm hơn) như một phiên
bản mềm của freezing.</p>`,
code2:null,
alts:[
{name:"Fine-tune toàn bộ mạng (khi dữ liệu ít)", v:"no", why:"Quên thảm hoạ. Với ~37 flow benign ở GĐ3, gradient từ tập nhỏ sẽ xoá trắng tri thức từ 2,8 triệu flow."},
{name:"Chỉ train lại lớp phân loại cuối (linear probing)", v:"no", why:"An toàn nhất nhưng quá cứng: nếu shift nằm ở tầng biểu diễn (mà KS-test cho thấy đúng là như vậy) thì đổi mỗi lớp cuối không cứu nổi."},
{name:"Adapter / LoRA (chèn module nhỏ, đóng băng phần còn lại)", v:"no", why:"Giải pháp hiện đại và đúng bài, nhưng thêm độ phức tạp cài đặt lớn cho một mạng chỉ 4 tầng / vài triệu tham số. Lợi ích không tương xứng ở quy mô này."},
{name:"Đóng băng embedding + 2 khối đầu, học lại 2 khối cuối (lr = 1e-5)", v:"ok", why:"Giữ tri thức chung, cho phép thích nghi phần chuyên biệt miền, và tôn trọng ràng buộc scaler↔embedding (embedding đóng băng → scaler cũ phải giữ nguyên)."},
{name:"Full unfreeze + learning rate phân tầng (GĐ5)", v:"ok", why:"Khi đã có 63.401 flow benign thật, dữ liệu đủ nhiều để không sợ quên. Learning rate phân tầng thay thế vai trò của freezing một cách mềm dẻo hơn."}]
});

id:"model-surgery", phase:"gd3", tag:"Học chuyển giao", title:"Model Surgery — ghép 3 đặc trưng mới vào mạng đã học",
one:"Muốn thêm đặc trưng mới mà không vứt bỏ trọng số cũ: khởi tạo mạng 80 chiều rồi cấy trọng số của mạng 77 chiều vào.",
why:`<p>Chẩn đoán cho thấy cần thêm đặc trưng mới để bắt được hành vi tấn công trong môi trường WSL. Nhưng model cũ
được xây cho đúng 77 đặc trưng. Thêm 3 cột nữa nghĩa là kiến trúc đổi → không nạp được checkpoint cũ.</p>
<p>Train lại từ đầu với 80 cột? Vứt bỏ toàn bộ tri thức từ 2,8 triệu flow. Không chấp nhận được.</p>`,
how:`<p><strong>Chính kiến trúc Feature Tokenizer làm cho việc này khả thi.</strong> Vì mỗi đặc trưng có một
<code>nn.Linear(1, d_model)</code> <em>riêng</em> (không phải một ma trận chung), nên thêm đặc trưng chỉ là thêm
module vào <code>ModuleList</code> — 77 module cũ không hề bị ảnh hưởng.</p>
<p>Quy trình:</p>
<ul>
<li>Khởi tạo mạng mới với <code>num_features = 80</code> (3 embedding cuối là ngẫu nhiên).</li>
<li>Chép trọng số 77 embedding cũ vào 77 vị trí đầu.</li>
<li>Chép nguyên <code>transformer_blocks</code>, <code>norm</code>, <code>classifier</code>, và cả token
<code>[CLS]</code> — những phần này <em>không phụ thuộc số đặc trưng</em> (Attention chạy trên chuỗi dài bao nhiêu
cũng được).</li>
<li>Đóng băng 77 embedding cũ, chỉ cho 3 embedding mới học.</li>
</ul>`,
code:[{file:"Domain_Adaptation_Workspace/scripts/3_feature_engineering_v2.py", lines:"249–285",
snippet:`print("[*] Khởi tạo mô hình 80 Features và chép đè trọng số (Model Surgery)...")
model_old = FTTransformer(num_features=77, ...)
model_old.load_state_dict(torch.load('.../best_stage1_model.pt'))

model = FTTransformer(num_features=80, ...)      # 3 embedding cuối: ngẫu nhiên

# 1. Feature Embedding cho 77 cột đầu
for i in range(77):
    model.feature_embedding.feature_embeddings[i].load_state_dict(
        model_old.feature_embedding.feature_embeddings[i].state_dict())
model.feature_embedding.cls_token.data.copy_(model_old.feature_embedding.cls_token.data)

# 2. Transformer Blocks và Classifier — chép nguyên, không phụ thuộc số feature
model.transformer_blocks.load_state_dict(model_old.transformer_blocks.state_dict())
model.classifier.load_state_dict(model_old.classifier.state_dict())

# --- LAYER FREEZING (Bảo vệ trí nhớ) ---
for i in range(77):
    for param in model.feature_embedding.feature_embeddings[i].parameters():
        param.requires_grad = False
for i in range(77, 80):                          # chỉ 3 embedding MỚI được học
    for param in model.feature_embedding.feature_embeddings[i].parameters():
        param.requires_grad = True`,
note:"Điểm tinh tế: <code>transformer_blocks</code> chép được nguyên vẹn vì Self-Attention <strong>không quan tâm chuỗi dài bao nhiêu</strong> — 78 token hay 81 token đều dùng chung một bộ trọng số Q/K/V."}],
codeOutro:`<p><strong>Cái giá dài hạn:</strong> Model Surgery để lại một <em>vết sẹo cấu trúc</em>. 80 đặc trưng của
V8.5 được chia thành hai nhóm mang tính lịch sử (77 cũ + 3 mới), và HybridFeatureScaler phải giữ mãi ranh giới ấy.
Đây là lý do không thể "cắt gọn" bộ đặc trưng của V8.5 về sau — mọi cải tiến đều phải sống chung với vết sẹo này.</p>`,
alts:[
{name:"Train lại từ đầu với 80 đặc trưng", v:"no", why:"Vứt bỏ tri thức từ 2,8 triệu flow CIC-IDS-2017 để đổi lấy hơn 100 nghìn flow testbed. Chắc chắn tệ hơn."},
{name:"Không thêm đặc trưng, chỉ fine-tune 77 cột cũ", v:"no", why:"Các hành vi cần bắt (Slowloris giữ kết nối, PortScan gửi-không-nhận) không hiện ra trong 77 đặc trưng gốc — chính vì thế mới cần thêm."},
{name:"Nhét 3 đặc trưng mới qua một mạng phụ rồi cộng vào", v:"no", why:"Chúng sẽ không tham gia vào cơ chế Attention với 77 đặc trưng kia — mất hoàn toàn khả năng học tương tác chéo, vốn là lý do dùng Transformer."},
{name:"Model Surgery: mở rộng ModuleList + chép trọng số + đóng băng phần cũ", v:"ok", why:"Giữ trọn tri thức cũ, cho phép học đặc trưng mới, và khả thi <em>chính vì</em> Feature Tokenizer dùng embedding riêng cho từng cột."}],

<p>Thứ tự cột trở thành một <strong>hợp đồng bất khả xâm phạm</strong>: 77 cột đầu phải đúng là 77 cột gốc của

code:[{file:"Domain_Adaptation_Workspace/scripts/3c_stage3_hybrid_pipeline.py", lines:"241–256, 275–285",
snippet:`# 2a. Scaler GỐC cho 77 features (KHÔNG fit lại, giữ nguyên)
scaler_77 = joblib.load(os.path.join(MODEL_DIR, 'scaler_stage1.pkl'))
print(f"  77 features: {type(scaler_77).__name__} (giữ nguyên từ CIC-IDS-2017)")

X_mixed_new = X_mixed[:, 77:]      # 3 features mới → fit scaler mới
X_mixed_old = X_mixed[:, :77]      # 77 features cũ → transform bằng scaler cũ

    'scaler_77_original': scaler_77,
    'n_old_features': 77, 'n_new_features': 3,
    'scaler_type': 'Hybrid(PowerTransformer_77_original + PowerTransformer_3_new)',

T.push({
id:"smote", phase:"gd3", tag:"Cân bằng dữ liệu · kết quả âm", title:"SMOTE — sinh mẫu nhân tạo cho lớp hiếm, và vì sao nó không cứu được",
one:"Nội suy giữa các mẫu lớp hiếm để tạo mẫu mới. Đã thử (V6), không giải quyết được PortScan.",
why:`<p>PortScan chỉ có 442 mẫu so với 91.600 mẫu DoS. Ý tưởng tự nhiên: sinh thêm mẫu PortScan nhân tạo cho cân.</p>`,
how:`<p><strong>SMOTE</strong> (Synthetic Minority Over-sampling): với mỗi mẫu lớp hiếm, tìm k láng giềng gần nhất
<em>cùng lớp</em>, chọn ngẫu nhiên một láng giềng, rồi tạo mẫu mới nằm trên đoạn thẳng nối hai điểm:</p>
<div class="formula">x_new = x_i + λ · (x_neighbor − x_i),      λ ~ U(0, 1)</div>
<p><strong>SMOTE-ENN</strong>: sau khi sinh mẫu, dùng Edited Nearest Neighbours dọn dẹp — xoá những mẫu (kể cả mẫu
thật) có nhãn khác đa số láng giềng của nó, nhằm làm sạch vùng ranh giới bị chồng lấn.</p>`,
code:[{file:"Phase3_4_Retrain/archive_v6_smote/src/4d_retrain_smote_v6.py", lines:"182–191",
snippet:`# 4. SMOTE (OVERSAMPLING)
print("\\n[*] Áp dụng SMOTE lên tập Train...")
target_smote = 15000
smote_strategy = {}
for ...:
    # Nếu số lượng hiện tại nhỏ hơn target_smote, nâng lên target_smote`,
note:"Thư mục tên <code>archive_v6_smote/</code> — chữ <em>archive</em> đã nói hết: hướng này đã bị bỏ."}],
codeOutro:`<p><strong>Vì sao thất bại — và đây mới là phần đáng nói:</strong> SMOTE nội suy <em>trong không gian đặc
trưng</em>. Nó giả định rằng điểm nằm giữa hai mẫu PortScan cũng là PortScan. Nhưng khi PortScan và Benign
<strong>chồng lên nhau</strong> trong chính không gian đó (do NAT — xem mục sau), thì điểm nội suy giữa hai mẫu
PortScan rất có thể rơi thẳng vào vùng Benign. SMOTE không tạo ra thông tin mới; nó chỉ <em>tô đậm</em> một cấu
trúc vốn đã không phân tách được.</p>`,
alts:[
{name:"SMOTE / SMOTE-ENN", v:"warn", why:"<strong>Đã thử (V6) — không giải quyết được PortScan.</strong> Nội suy trong không gian đặc trưng vô nghĩa khi hai lớp chồng lấn trong chính không gian đó."},
{name:"Random oversampling (nhân bản mẫu)", v:"no", why:"Không thêm thông tin, chỉ tăng nguy cơ overfit vào đúng 442 mẫu PortScan cụ thể."},
{name:"Random undersampling lớp đông", v:"no", why:"Vứt bỏ hàng chục nghìn flow DoS thật — mất thông tin thật để đổi lấy cân bằng hình thức."},
{name:"Weighted Random Sampling (lấy mẫu có trọng số khi tạo batch)", v:"warn", why:"Mỗi batch được lấy mẫu sao cho các lớp xuất hiện cân bằng. Rẻ hơn SMOTE và không bịa dữ liệu, nhưng cũng chỉ chữa được mất cân bằng — không chữa được chồng lấn."},
{name:"Focal Loss + trọng số lớp (ở tầng loss)", v:"ok", why:"Đạt hiệu quả cân bằng tương tự mà không bịa mẫu và không vứt dữ liệu. Đây là hướng cuối cùng được chọn."},
{name:"Giải PortScan bằng LUẬT thay vì bằng dữ liệu", v:"ok", why:"Kết luận thật sự của cả chuỗi thí nghiệm: PortScan không phải bài toán mất cân bằng, mà là bài toán <em>không phân tách được ở cấp flow đơn</em>. Không có kỹ thuật lấy mẫu nào chữa nổi. Xem PortScanRule ở GĐ5."}]
});

T.push({
id:"portscan-nat", phase:"gd3", tag:"Giới hạn nguyên lý", title:"PortScan không phân tách được dưới NAT — giới hạn thật sự",
one:"Không phải lỗi model, không phải lỗi dữ liệu. Thông tin cần thiết đơn giản không tồn tại trong một flow đơn lẻ.",
why:`<p>Đây là kết luận quan trọng nhất của cả đồ án, và là thứ giải thích vì sao <em>mọi</em> kỹ thuật cân bằng
dữ liệu đều thất bại với PortScan.</p>
<p>Bản chất của quét cổng: kẻ tấn công gửi một gói SYN tới cổng 22, một gói tới cổng 23, một gói tới cổng 80…
<strong>Mỗi lần chạm cổng là một flow riêng biệt.</strong> Nhìn vào <em>một</em> flow trong số đó, ta thấy gì?
Một gói SYN gửi đi, không nhận lại gì. Nhưng một máy khách bình thường thử kết nối tới một cổng đang đóng cũng
tạo ra <strong>đúng một flow như vậy</strong>.</p>
<p>Cái làm nên "quét cổng" là <strong>quan hệ giữa nhiều flow</strong> — cùng một nguồn chạm hàng trăm cổng khác
nhau trong vài giây. Thông tin đó <em>không nằm trong bất kỳ flow nào cả</em>.</p>`,
how:`<p>Nói bằng ngôn ngữ học máy: hai lớp có <strong>miền giá trị chồng lấn</strong> (overlapping support) trong
không gian đặc trưng 80 chiều.</p>
<div class="formula">∃ vùng R:  P(x ∈ R | PortScan) > 0  VÀ  P(x ∈ R | Benign) > 0</div>
<p>Với vùng R đó, <strong>không tồn tại</strong> hàm phân lớp nào — dù phức tạp đến đâu — có thể đạt độ chính xác
100%. Đây là giới hạn Bayes, không phải giới hạn của FT-Transformer.</p>
<p>Môi trường WSL2 + NAT còn làm mọi thứ tệ hơn: NAT làm nhoè IP nguồn thật, và mạng loopback ảo khiến các
đặc trưng thời gian (IAT) của flow quét gần như trùng với flow bình thường.</p>`,
codeIntro:`<p>Chuỗi bằng chứng thực nghiệm — mỗi cách chữa "trong không gian đặc trưng" đều thất bại theo cùng một kiểu:</p>`,
code:[{file:"(tổng hợp thực nghiệm GĐ3 → GĐ5)", lines:"",
snippet:`Focal Loss (gamma=2)      →  PortScan F1  7,5%  →  6,8%   (không cải thiện)
SMOTE (V6)                →  không giải quyết được
Ngưỡng global 0,6         →  PortScan recall        →  0%    (giết hẳn)
Ngưỡng per-class          →  PortScan recall        →  36,5% (đỡ, chưa đủ)
Fine-tune benign thật     →  PortScan (classifier)  →  0%    (mất hẳn)
─────────────────────────────────────────────────────────────
PortScanRule (đếm cổng)   →  PortScan F1            →  0,996`,
note:"Đọc bảng này theo chiều dọc: mọi can thiệp <em>trong</em> không gian đặc trưng đều đâm đầu vào tường. Chỉ khi thoát <em>ra ngoài</em> không gian đó — đếm số cổng đích duy nhất theo (nguồn, cửa sổ thời gian), tức là dùng thông tin <strong>giữa các flow</strong> — bài toán mới giải được."}],
alts:[
{name:"Thêm dữ liệu PortScan", v:"no", why:"Thêm bao nhiêu cũng không tạo ra được ranh giới ở nơi hai lớp chồng nhau. Đã thu 77.218 flow PortScan ở GĐ5 — vẫn không cứu được classifier."},
{name:"Model mạnh hơn / sâu hơn", v:"no", why:"Giới hạn Bayes không phụ thuộc dung lượng model. Không có hàm nào phân tách được hai phân phối chồng lấn."},
{name:"Kỹ thuật cân bằng (Focal, SMOTE, sampling)", v:"warn", why:"<strong>Đã thử tất cả — thất bại.</strong> Chúng chữa mất cân bằng, không chữa chồng lấn. Hai bệnh khác nhau."},
{name:"Đặc trưng liên-flow (đếm cổng đích theo cửa sổ thời gian)", v:"ok", why:"Đưa vào <em>thông tin mới</em> mà một flow đơn lẻ không thể có. Đây là cách duy nhất đúng về mặt nguyên lý — và nó cho PortScan F1 = 0,996."},
{name:"Mô hình chuỗi trên chuỗi gói (LSTM/Transformer theo gói)", v:"no", why:"Cũng đúng về nguyên lý và mạnh hơn luật, nhưng vượt phạm vi đồ án. Được ghi là hướng phát triển."}],
ev:[["0,996","PortScan F1 khi giải bằng luật liên-flow (so với ~7% khi giải bằng classifier)"]],
gap:`<strong>Cách trả lời hội đồng nếu bị hỏi "sao model không bắt được PortScan":</strong> đây không phải thất bại
của model mà là <em>phát hiện</em> của đồ án. Việc chứng minh được rằng PortScan không phân tách ở cấp flow đơn —
bằng một chuỗi thí nghiệm loại trừ có hệ thống — chính là lý do chính đáng để đưa luật liên-flow vào hệ thống, và
là luận cứ mạnh nhất cho kiến trúc lai.`
});

<p>Một cái là <em>sự kiện tại một thời điểm</em>, cái kia là <em>một khoảng thời gian</em>. Phải ánh xạ được
gói vào flow chứa nó.</p>`,
how:`<p>Khoá ghép là <strong>5-tuple + cửa sổ thời gian</strong>: một cảnh báo Snort thuộc về flow nào nếu 5-tuple
khớp và timestamp của gói nằm trong khoảng [flow_start, flow_start + duration].</p>
<p>Sau khi ghép, mức độ tin cậy được nâng theo sự đồng thuận:</p>
<ul>
<li><strong>Cả hai cùng báo</strong> → độ tin cậy cao nhất (hai phương pháp độc lập cùng kết luận).</li>
<li><strong>Chỉ Snort báo</strong> → tấn công đã biết, model có thể chưa học kiểu này.</li>
<li><strong>Chỉ model báo</strong> → nghi vấn biến thể mới / zero-day → <em>chính là giá trị của tầng ML</em>,
nhưng cũng là nơi báo giả tập trung.</li>
</ul>`,
code:[{file:"Custom_IDS_Testbed/scripts/dataset_builder_v2.py", lines:"—",
snippet:`# Đồng bộ cảnh báo Snort (theo GÓI) với flow CICFlowMeter (theo KHOẢNG)
# → khoá ghép: 5-tuple (src_ip, src_port, dst_ip, dst_port, proto)

T.push({
id:"conf-threshold-rule", phase:"gd5", tag:"Hậu xử lý · luật", title:"Luật ngưỡng tin cậy — hạ báo động yếu về Benign",
one:"Dự đoán tấn công có confidence < 0,6 thì hạ về Benign. Một dòng if, Macro-F1 0,679 → 0,725.",
why:`<p>Sau khi chạy thật, triệu chứng rõ ràng: model báo tấn công quá nhiều trên traffic bình thường
(Benign recall chỉ 75,4%). Nhưng quan sát kỹ hơn: <strong>phần lớn các báo giả ấy có confidence thấp</strong>,
trong khi tấn công thật thường được nhận diện với confidence cao.</p>
<p>Nếu vậy thì có một ranh giới rẻ tiền để cắt: đừng tin những báo động yếu ớt.</p>`,
how:`<p>Áp dụng nguyên tắc <em>"nghi ngờ thì cho là vô tội"</em> — mã hoá lệch chi phí: báo giả một flow bình thường
tốn công người vận hành, nên khi model không chắc thì nghiêng về Benign.</p>
<div class="formula">nếu  pred ≠ Benign  VÀ  conf < T  →  pred := Benign          (T = 0,6)</div>
<p>Kiến trúc luật tuân theo <strong>Open/Closed Principle</strong>: mỗi luật là một class riêng implement
<code>PredictionRule</code>. Thêm luật mới = thêm class, không sửa code cũ.</p>`,
code:[{file:"live_detection/ids_replay/postprocess.py", lines:"24–38",
snippet:`class ConfidenceThresholdRule:
    """Phương án A: dự đoán TẤN CÔNG có confidence < ngưỡng → hạ về Benign (giảm false positive)."""
    name = "confidence_threshold"

    def __init__(self, threshold: float, benign_label: str = "Benign"):
        self.threshold = float(threshold)
        self.benign_label = benign_label

    def apply(self, df, preds, confs):
        if self.threshold <= 0:
            return preds
        for i in range(len(preds)):
            if preds[i] != self.benign_label and confs[i] < self.threshold:
                preds[i] = self.benign_label
        return preds`,
note:"Luật chỉ hạ <em>xuống</em> Benign, không bao giờ nâng <em>lên</em> tấn công — bất đối xứng có chủ ý, đúng như voting ở GĐ2."},
{file:"live_detection/replay_config.json", lines:"conf_threshold",
snippet:`"conf_threshold": 0.6,
"_conf_threshold_note": "Phương án A: ... T=0.6 đưa Macro F1 0.679→0.725,
   Benign Recall 75.4%→95.2% (attack recall ~98%); kết hợp luật quét cổng
   → Macro F1 cuối 0.978."`,
note:"Ngưỡng nằm trong config, không hard-code — có thể chỉnh khi triển khai sang mạng khác mà không đụng code."},
{file:"live_detection/ids_replay/postprocess.py", lines:"65–75",
snippet:`class RulePipeline:
    """Áp lần lượt các luật. Thứ tự quan trọng: threshold trước (hạ FP), rồi PortScan override."""
    def apply(self, df, preds, confs):
        preds = list(preds)
        for rule in self.rules:
            preds = rule.apply(df, preds, confs)
        return preds`,
note:"<strong>Thứ tự có ý nghĩa:</strong> ngưỡng chạy trước sẽ hạ cả những PortScan confidence thấp về Benign — rồi PortScanRule mới kéo chúng trở lại. Nếu đảo thứ tự, luật ngưỡng sẽ xoá mất kết quả của PortScanRule."}],
alts:[
{name:"Không hậu xử lý, tin thẳng model", v:"no", why:"Benign recall chỉ 75,4% — cứ 4 flow bình thường thì 1 flow bị báo động. Không ai dùng nổi hệ thống như vậy."},
{name:"Train lại model để bớt báo giả", v:"warn", why:"Đúng bài hơn và cuối cùng <em>đã làm</em> (v8_7 ở Bước 5, FPR còn 0,29%). Nhưng tốn nhiều giờ GPU và cần dữ liệu benign thật — trong khi luật ngưỡng cho kết quả ngay, không tốn gì."},
{name:"Một ngưỡng chung cho mọi lớp", v:"warn", why:"<strong>Đang dùng, và có tác dụng phụ đã biết:</strong> ngưỡng 0,6 giết PortScan xuống 0% recall vì PortScan vốn có confidence thấp. Cứu được nhờ PortScanRule chạy sau. Giải pháp sạch hơn là ngưỡng per-class (đã tính sẵn ở Bước 2, chưa wire vào)."},
{name:"Ngưỡng tin cậy T = 0,6 + PortScanRule bù lại", v:"ok", why:"Rẻ (không train lại), hiệu quả ngay (Benign recall 75,4% → 95,2%), và tác dụng phụ lên PortScan được luật khác bù."}],
ev:[["0,679 → 0,725","Macro-F1 khi bật luật ngưỡng"],
["75,4% → 95,2%","Benign recall"],
["~98%","attack recall vẫn giữ được"]]
});
