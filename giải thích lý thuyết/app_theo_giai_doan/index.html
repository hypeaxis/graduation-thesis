id:"portscan-rule", phase:"gd5", tag:"Hậu xử lý · luật", title:"PortScanRule — đưa thông tin liên-flow vào bằng luật",
one:"Một nguồn chạm ≥ 15 cổng đích khác nhau trong 2 giây thì đó là quét cổng. Model không thấy được điều này; luật thì thấy.",
why:`<p>Đây là chỗ toàn bộ chuỗi chẩn đoán ở GĐ3 kết tinh lại. Đã chứng minh: PortScan <strong>không phân tách được
ở cấp flow đơn</strong> — thông tin cần thiết là quan hệ <em>giữa các flow</em>, và không kỹ thuật học máy nào
(Focal, SMOTE, thêm dữ liệu, model lớn hơn) chữa được điều đó.</p>
<p>Vậy thì đừng bắt model làm việc bất khả thi. Hãy đưa thông tin còn thiếu vào bằng một luật.</p>`,
how:`<p>Tính <strong>độ trải cổng</strong> (port spread): với mỗi cặp (IP nguồn, cửa sổ thời gian), đếm số cổng đích
<em>duy nhất</em> mà nguồn đó đã chạm tới.</p>
<div class="formula">intensity(i) = | { dst_port : cùng src, cùng bucket thời gian } |
nếu intensity ≥ 15  →  pred := PortScan          (cửa sổ 2 giây)</div>
<p>Đây là một đặc trưng <strong>không tồn tại</strong> trong 80 đặc trưng của model, vì nó cần nhìn nhiều flow cùng
lúc. Luật cung cấp đúng thông tin mà kiến trúc flow-based đã đánh mất.</p>`,
code:[{file:"live_detection/ids_replay/features.py", lines:"69–77",
snippet:`def port_spread(src_arr, dport_arr, ts_arr, window_ms):
    """Số cổng đích DUY NHẤT theo (src, bucket thời gian) — đặc trưng PortScan."""
    bucket = (ts_arr // max(window_ms, 1)).astype(np.int64)
    ports = defaultdict(set)
    for i in range(n):
        ports[(src_arr[i], bucket[i])].add(int(dport_arr[i]))
    return np.array([len(ports[(src_arr[i], bucket[i])]) for i in range(n)])`,
note:"<code>set</code> đảm bảo đếm cổng <em>duy nhất</em>: chạm cổng 22 một trăm lần vẫn chỉ tính là 1."},
{file:"live_detection/ids_replay/postprocess.py", lines:"41–62",
snippet:`class PortScanRule:
    """Phương án D1: host (src) tiếp xúc > N cổng đích duy nhất trong cửa sổ ngắn → PortScan."""
    def __init__(self, scanner_ip: str, window_sec: float = 2.0, min_unique_ports: int = 15):
        ...
    def apply(self, df, preds, confs):
        ts = col(df, "Timestamp", "").apply(parse_ts).values.astype(np.float64)
        if (ts > 0).mean() <= 0.5:   # parse timestamp thất bại → bỏ qua (tránh false override)
            return preds
        intensity = port_spread(src, dport, ts, self.window_ms)
        for i in range(len(preds)):
            if intensity[i] >= self.min_ports and src[i] == self.scanner_ip \\
               and preds[i] != self.label:
                preds[i] = self.label`,
note:"Cơ chế an toàn ở dòng 54: nếu quá nửa số timestamp không parse được thì luật <strong>tự tắt</strong> thay vì override bừa. Luật phải biết khi nào mình không đủ thông tin để nói."}],
alts:[
{name:"Bắt model học PortScan (thêm dữ liệu / Focal / SMOTE)", v:"warn", why:"<strong>Đã thử tất cả — thất bại có hệ thống.</strong> Focal: 7,5%→6,8%. SMOTE: không cải thiện. Fine-tune benign thật: classifier mất hẳn PortScan (38,6%→0%). Đây là giới hạn nguyên lý, không phải thiếu nỗ lực."},
{name:"Thêm đặc trưng liên-flow vào chính vector đầu vào của model", v:"no", why:"Về mặt lý thuyết đẹp hơn (model tự học ngưỡng thay vì ta đặt tay). Nhưng phải train lại toàn bộ, và <strong>phá vỡ Model Surgery</strong>: 80 đặc trưng của V8.5 bị khoá vào HybridFeatureScaler với ranh giới 77/3 — thêm cột nghĩa là làm lại phẫu thuật."},
{name:"Dùng luật Snort cho PortScan", v:"warn", why:"Snort có luật quét cổng, nhưng đó là ở nhánh song song — không sửa được <em>nhãn</em> mà model xuất ra cho dashboard. Vẫn nên bật, như một tầng độc lập."},
{name:"PortScanRule ở tầng hậu xử lý", v:"ok", why:"Đưa thông tin liên-flow vào mà không phải train lại, không phải mổ lại model, và cho PortScan F1 0,996. Chi phí tính toán không đáng kể."}],
ev:[["0,996","PortScan F1 sau khi bật luật (so với ~7% khi để model tự lo)"],
["15 cổng / 2 giây","ngưỡng đang dùng; đo được recall 99,2% với báo giả 0% trên benign"],
["0,725 → 0,978","Macro-F1 end-to-end khi cộng PortScanRule vào luật ngưỡng"]],
gap:`<strong>Lỗ hổng đã tự phát hiện khi rà soát (08/07) — phải nói ra nếu bị hỏi:</strong> con số "PortScanRule bắt
100%" là <strong>ảo</strong>. Luật chỉ override khi <code>src == scanner_ip</code>
(<a href="#/lt/portscan-rule">postprocess.py:60</a>), mà <code>scanner_ip</code> lấy từ
<code>settings.attacker_ip</code> trong config — nghĩa là con số đó được đo trong chế độ replay <em>đã biết trước
IP kẻ tấn công</em>. Trong mạng thật với IP lạ, luật sẽ <strong>câm</strong>. Thêm nữa, <code>port_spread</code>
dùng bucket thời gian <em>cố định</em> chứ không phải cửa sổ trượt, nên một cuộc quét chậm hoặc vắt qua ranh giới
bucket sẽ vô hình. Kế hoạch sửa (rule IP-agnostic + cửa sổ trượt) đã viết ở
<code>training/KEHOACH_AUDIT_VA_PORTSCAN_LIVE.md</code>, chưa thực thi.`
});
T.push({
id:"temperature-scaling", phase:"gd5", tag:"Hiệu chỉnh xác suất", title:"Temperature Scaling — làm confidence nói thật",
one:"Chia logit cho một số T học được. Không đổi dự đoán nào, chỉ làm confidence phản ánh đúng xác suất đúng.",
why:`<p>Mọi luật hậu xử lý ở trên đều dựa vào <strong>confidence</strong>. Nhưng confidence của model có đáng tin
không? Chẩn đoán Bước 1 trả lời: <strong>không</strong>. Các flow benign thật bị báo nhầm DoS có confidence trung
bình <strong>0,82</strong> — model sai mà rất chắc chắn. ECE (sai số hiệu chuẩn kỳ vọng) = 0,213.</p>
<p>Một model được hiệu chuẩn tốt phải có tính chất: trong số các dự đoán có confidence 0,8, đúng khoảng 80%.
V8.5 không có tính chất đó → mọi ngưỡng đặt trên confidence đều đang đứng trên cát.</p>`,
how:`<p>Thêm đúng <strong>một</strong> tham số vô hướng T, chia vào logit trước khi softmax:</p>
<div class="formula">p = softmax(z / T)        T > 1 → làm "mềm" phân phối (bớt tự tin)
                          T < 1 → làm "nhọn" (tự tin hơn)</div>
<p>T được học bằng cách tối thiểu hoá NLL trên một tập hiệu chuẩn riêng. Tính chất then chốt:
<strong>chia mọi logit cho cùng một số không làm đổi thứ tự của chúng</strong> → <code>argmax</code> không đổi →
<strong>không một dự đoán nào bị thay đổi</strong>. Nó chỉ chỉnh lại <em>thang đo</em> của độ tin cậy.</p>`,

{name:"Mô hình chuỗi trên chuỗi gói (LSTM / Transformer theo gói)", v:"no", why:"Đúng về nguyên lý: giữ được thứ tự, học được quan hệ liên-flow, tự học ngưỡng. Nhưng phải bỏ CICFlowMeter, tự quản lý trạng thái flow, và huấn luyện lại từ đầu — vượt phạm vi đồ án. <strong>Ghi là hướng phát triển chính.</strong>"},
{name:"Graph Neural Network trên đồ thị host–host", v:"no", why:"Mô hình hoá tự nhiên quan hệ 'một nguồn chạm nhiều đích' (chính là PortScan). Rất hứa hẹn, nhưng cần dựng lại toàn bộ biểu diễn dữ liệu. Hướng phát triển."},
{name:"Thêm đặc trưng cửa sổ trượt vào chính vector đầu vào", v:"warn", why:"Đường trung dung: giữ kiến trúc, nhưng thêm cột đếm liên-flow. Vướng đúng vết sẹo Model Surgery (ranh giới 77/3 của HybridFeatureScaler) — phải mổ lại. Khả thi nhưng tốn."}],
gap:`<strong>Câu chốt nên dùng khi bảo vệ:</strong> hệ thống này đạt Macro-F1 0,978 <em>với</em> một lớp luật liên-flow
bên ngoài model. Sự tồn tại của lớp luật đó không phải là điểm yếu cần giấu — nó là <strong>bằng chứng thực nghiệm</strong>
cho luận điểm rằng biểu diễn flow tĩnh, dù đang là chuẩn mực trong hầu hết nghiên cứu NIDS dựa trên CIC-IDS-2017,
có một giới hạn nguyên lý mà không kỹ thuật học máy nào vượt qua được.`
});
/* ==THEORIES== */

/* ---------------- render ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const CH = {ok:'đã chọn', no:'đã loại', warn:'thử & thất bại'};

function navHtml(filter){
  const f = (filter||'').trim().toLowerCase();
  return PHASES.map(p=>{
    let list = T.filter(t=>t.phase===p.id);
    if(f) list = list.filter(t=>(t.title+' '+t.tag+' '+t.why+' '+(t.alts||[]).map(a=>a.name).join(' ')).toLowerCase().includes(f));
    if(f && !list.length) return '';
    return `<div class="grp">
      <div class="grp-h" data-go="#/gd/${p.id}">
        <span class="grp-n">${p.n}</span>
        <span class="grp-t">${p.title}</span>
        <span class="grp-c">${list.length}</span>
      </div>
      <ul>${list.map(t=>`<li><a href="#/lt/${t.id}" class="${location.hash==='#/lt/'+t.id?'on':''}">${t.title}</a></li>`).join('')}</ul>
    </div>`;
  }).join('');
}

function home(){
  return `<div class="eyebrow">Tổng hợp lý thuyết · ${T.length} mục · 6 giai đoạn</div>
  <h1>Mỗi lý thuyết trong đồ án này là câu trả lời cho một triệu chứng có thật</h1>
  <p class="lede">Trang này không xếp lý thuyết theo chủ đề sách giáo khoa, mà theo <strong>giai đoạn của đồ án</strong> —
  vì một lý thuyết chỉ có nghĩa khi biết nó được gọi vào lúc nào, để chữa cái gì. Mỗi mục trả lời đủ bốn câu:
  vì sao cần nó, nó vận hành ra sao, <strong>nó nằm ở dòng nào trong code hiện tại</strong>, và vì sao không dùng
  phương án tương tự.</p>
  <div class="note"><strong>Cách đọc khi ôn bảo vệ:</strong> mỗi mục có một bảng <em>Sổ quyết định</em> liệt kê các
  phương án đã cân nhắc kèm trạng thái <span class="chip ok">đã chọn</span> <span class="chip no">đã loại</span>
  <span class="chip warn">thử &amp; thất bại</span>. Đây chính là phần hội đồng hay hỏi: “sao không dùng X?”.</div>
  <h2>Sáu giai đoạn</h2>
  <div class="tl">${PHASES.map(p=>`<a class="tl-item" href="#/gd/${p.id}">
    <div class="tl-n">${p.n}</div>
    <div><div class="tl-t">${p.title}</div><div class="tl-q">${p.q}</div>
    <div class="tl-r">${p.result}</div></div></a>`).join('')}</div>`;
}

function phase(p){
  const list = T.filter(t=>t.phase===p.id);
  return `<div class="crumb"><a href="#/">Tổng quan</a> / ${p.n}</div>
  <div class="eyebrow">${p.ws}</div>
  <h1>${p.title}</h1>
  <p class="lede">${p.intro}</p>
  <div class="note"><strong>Câu hỏi giai đoạn này phải trả lời:</strong> ${p.q}<br>
  <strong>Kết quả chốt lại:</strong> ${p.result}</div>
  <h2>Lý thuyết dùng trong giai đoạn (${list.length})</h2>
  <div class="tl">${list.map(t=>`<a class="tl-item" href="#/lt/${t.id}">
    <div class="tl-n">${t.tag}</div>
    <div><div class="tl-t">${t.title}</div><div class="tl-q">${t.one}</div></div></a>`).join('')}</div>`;
}

function theory(t){
  const p = PHASES.find(x=>x.id===t.phase);
  const code = (t.code||[]).map(c=>`<div class="codewrap">
      <div class="src"><b>${c.file}</b>${c.lines?`<span>: ${c.lines}</span>`:''}</div>
      <pre><code>${esc(c.snippet)}</code></pre>
      ${c.note?`<div class="cnote">${c.note}</div>`:''}
    </div>`).join('');
  return `<div class="crumb"><a href="#/">Tổng quan</a> / <a href="#/gd/${p.id}">${p.n} · ${p.title}</a></div>
  <div class="eyebrow">${t.tag}</div>
  <h1>${t.title}</h1>
  <p class="lede">${t.one}</p>

  <div class="blk"><div class="blk-h"><span class="eyebrow">1 · Vì sao cần nó</span></div>
    <div class="blk-b">${t.why}</div></div>

  <div class="blk"><div class="blk-h"><span class="eyebrow">2 · Nó hoạt động thế nào</span></div>
    <div class="blk-b">${t.how}</div></div>

  <div class="blk"><div class="blk-h"><span class="eyebrow">3 · Nó chạy ở đâu trong code hiện tại</span></div>
    <div class="blk-b">${t.codeIntro||''}${code}${t.codeOutro||''}</div></div>

  <div class="blk"><div class="blk-h"><span class="eyebrow">4 · Sổ quyết định — vì sao không dùng cái tương tự</span></div>
    <div class="blk-b"><table class="ledger">
      <thead><tr><th>Phương án</th><th>Trạng thái</th><th>Lý do</th></tr></thead>
      <tbody>${(t.alts||[]).map(a=>`<tr><td>${a.name}</td>
        <td><span class="chip ${a.v}">${CH[a.v]}</span></td><td>${a.why}</td></tr>`).join('')}</tbody>
    </table></div></div>

  ${(t.ev&&t.ev.length)?`<div class="blk"><div class="blk-h"><span class="eyebrow">5 · Bằng chứng số trong đồ án</span></div>
    <div class="blk-b"><ul class="ev">${t.ev.map(e=>`<li><b>${e[0]}</b><span>${e[1]}</span></li>`).join('')}</ul>
    ${t.gap?`<div style="margin-top:14px" class="gap">${t.gap}</div>`:''}</div></div>`
    :(t.gap?`<div class="blk"><div class="blk-h"><span class="eyebrow">5 · Giới hạn đã biết</span></div>
      <div class="blk-b"><div class="gap">${t.gap}</div></div></div>`:'')}`;
}

function route(){
  const h = location.hash || '#/';
  let html;
  if(h.startsWith('#/lt/')){
    const t = T.find(x=>x.id===h.slice(5));
    html = t ? theory(t) : home();
  } else if(h.startsWith('#/gd/')){
    const p = PHASES.find(x=>x.id===h.slice(5));
    html = p ? phase(p) : home();
  } else html = home();
  $('#main').innerHTML = html;
  $('#nav').innerHTML = navHtml($('#q').value);
  window.scrollTo(0,0);
}

$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim();
  $('#nav').innerHTML = navHtml(v);
  const n = v ? T.filter(t=>(t.title+' '+t.tag+' '+t.why+' '+(t.alts||[]).map(a=>a.name).join(' ')).toLowerCase().includes(v.toLowerCase())).length : 0;
  $('#hits').textContent = v ? `${n} kết quả` : '';
});
$('#nav').addEventListener('click', e=>{
  const g = e.target.closest('[data-go]');
  if(g) location.hash = g.dataset.go;
});
$('#home-link').addEventListener('click', ()=>{ location.hash = '#/'; });
window.addEventListener('hashchange', route);
route();
</script>

</body>
</html>
