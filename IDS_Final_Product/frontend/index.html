<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus IDS Dashboard</title>
  
  <style>
    :root {
      --bg-dark: #020617; /* Very dark slate for background */
      --bg-card: rgba(30, 41, 59, 0.9); /* Lighter slate for cards, higher opacity */
      --border-neon: rgba(56, 189, 248, 0.5); /* Stronger neon border */
      --text-main: #ffffff; /* Pure white text */
      --text-muted: #cbd5e1; /* Brighter muted text */
      
      --color-dos: #f43f5e;
      --color-probe: #eab308;
      --color-r2l: #ec4899;
      --color-u2r: #8b5cf6;
      --color-normal: #10b981;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', system-ui, sans-serif;
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.05), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.05), transparent 25%);
      min-height: 100vh;
    }

    * { box-sizing: border-box; }

    .glass-panel {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-neon);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }

    .glass-panel:hover {
      border-color: rgba(56, 189, 248, 0.6);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.15);
    }

    .title-glow {
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
      font-weight: 700;
      margin: 0;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0ea5e9, #3b82f6);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 15px rgba(14, 165, 233, 0.5);
    }

    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

    .tag {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      display: inline-block;
      text-transform: uppercase;
    }
    
    .tag-normal { background: rgba(16, 185, 129, 0.1); color: var(--color-normal); border: 1px solid var(--color-normal); }
    .tag-dos { background: rgba(244, 63, 94, 0.1); color: var(--color-dos); border: 1px solid var(--color-dos); }
    .tag-probe { background: rgba(234, 179, 8, 0.1); color: var(--color-probe); border: 1px solid var(--color-probe); }
    .tag-r2l { background: rgba(236, 72, 153, 0.1); color: var(--color-r2l); border: 1px solid var(--color-r2l); }
    .tag-u2r { background: rgba(139, 92, 246, 0.1); color: var(--color-u2r); border: 1px solid var(--color-u2r); }

    table { width: 100%; border-collapse: collapse; background: rgba(15, 23, 42, 0.5); border-radius: 8px; overflow: hidden; }
    th { text-align: left; padding: 14px 12px; color: #ffffff; font-size: 0.95rem; font-weight: 600; border-bottom: 2px solid rgba(255,255,255,0.1); background: rgba(30, 41, 59, 0.8); }
    td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.95rem; }
    tr:hover td { background: rgba(255,255,255,0.05); }

    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px; margin-bottom: 32px; }
    .grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; margin-bottom: 32px; }
    
    @media (max-width: 768px) {
      .grid-2 { grid-template-columns: 1fr; }
    }
    
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .stat-value { font-size: 2.5rem; font-weight: bold; margin: 10px 0; }
    
    select {
      background: #18181b;
      border: 1px solid var(--border-neon);
      color: white;
      padding: 10px;
      border-radius: 8px;
      outline: none;
    }
  </style>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Recharts -->
  <script src="https://unpkg.com/prop-types@15.6/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.10.3/umd/Recharts.js"></script>
</head>
<body>
  <div id="root"></div>

  <script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      document.body.innerHTML += '<div style="color:red; padding: 20px;"><h3>JavaScript Error:</h3><p>' + msg + '</p><p>Line: ' + lineNo + '</p><pre>' + (error && error.stack ? error.stack : '') + '</pre></div>';
      return false;
    };
  </script>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, PieChart, Pie, Cell } = window.Recharts;

    const COLORS = {
      Normal: '#10b981',
      DoS: '#f43f5e',
      Probe: '#eab308',
      R2L: '#ec4899',
      U2R: '#8b5cf6'
    };

    const API_BASE = '/api';

    function PredictionsTable({ predictions }) {
      if (!predictions || predictions.length === 0) return null;
      return (
        <div style={{ overflowX: 'auto', marginTop: '20px' }}>
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Protocol</th>
                <th>Service</th>
                <th>Duration</th>
                <th>Bytes (Src/Dst)</th>
                <th>Prediction</th>
                <th>Confidence</th>
              </tr>
            </thead>
            <tbody>
              {predictions.map((p, idx) => (
                <tr key={idx}>
                  <td style={{color: 'var(--text-muted)'}}>#{idx + 1}</td>
                  <td style={{textTransform: 'uppercase'}}>{p.protocol_type || 'TCP'}</td>
                  <td>{p.service || 'http'}</td>
                  <td>{parseFloat(p.duration || 0).toFixed(2)}s</td>
                  <td>{p.src_bytes || 0} / {p.dst_bytes || 0}</td>
                  <td>
                    <span className={`tag tag-${p.predicted_label?.toLowerCase()}`}>
                      {p.predicted_label}
                    </span>
                  </td>
                  <td>
                    <div style={{display: 'flex', alignItems: 'center', gap: '8px'}}>
                      <div style={{width: '60px', height: '8px', background: '#27272a', borderRadius: '4px', overflow: 'hidden'}}>
                        <div 
                          style={{
                            height: '100%', 
                            width: `${(p.confidence || 0) * 100}%`,
                            background: p.predicted_label === 'Normal' ? '#10b981' : '#f43f5e'
                          }}
                        />
                      </div>
                      <span style={{fontSize: '0.8rem', color: 'var(--text-muted)'}}>
                        {(p.confidence * 100).toFixed(1)}%
                      </span>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function DetectionControl({ onComplete }) {
      const [loading, setLoading] = useState(false);
      const [scenario, setScenario] = useState('mixed');
      const [lastResult, setLastResult] = useState(null);

      const handleSimulate = async () => {
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/detect`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              scenario,
              total_events: 100,
              benign_ratio: 0.35,
              window_seconds: 2.0
            })
          });
          const data = await res.json();
          setLastResult(data);
          onComplete();
        } catch (e) {
          alert('Detection failed. Is the backend running?');
          console.error(e);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="glass-panel">
          <div className="flex-between" style={{marginBottom: '20px'}}>
            <div>
              <h2 style={{margin: 0}}>🚀 Active Simulation</h2>
              <p style={{color: 'var(--text-muted)', fontSize: '0.9rem', margin: '5px 0 0 0'}}>
                Generate traffic and run through the FT-Transformer AI pipeline.
              </p>
            </div>
            <div style={{display: 'flex', gap: '10px'}}>
              <select value={scenario} onChange={e => setScenario(e.target.value)}>
                <option value="mixed">Mixed Traffic (All Attacks)</option>
                <option value="dos_syn_flood">DoS SYN Flood</option>
                <option value="port_scan">Probe / Port Scan</option>
                <option value="normal">Normal Traffic Only</option>
              </select>
              <button className="btn-primary" onClick={handleSimulate} disabled={loading}>
                {loading ? '⏳ Analyzing Traffic...' : '▶ Simulate & Detect'}
              </button>
            </div>
          </div>
          {lastResult && (
            <div>
              <h3 style={{marginTop: '20px'}}>Latest Inspection Results (Session: {lastResult.session_id})</h3>
              <PredictionsTable predictions={lastResult.sample_predictions} />
            </div>
          )}
        </div>
      );
    }

    function Dashboard() {
      const [stats, setStats] = useState(null);
      const [loading, setLoading] = useState(true);

      const loadStats = async () => {
        try {
          const res = await fetch(`${API_BASE}/stats`);
          const data = await res.json();
          setStats(data);
        } catch (e) {
          console.error(e);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        loadStats();
        const interval = setInterval(loadStats, 3000);
        return () => clearInterval(interval);
      }, []);

      if (loading && !stats) return <div style={{padding: '50px', textAlign: 'center'}}>Loading IDS Core...</div>;

      const totalAttacks = Object.entries(stats?.attack_counts || {})
        .filter(([k]) => k !== 'Normal')
        .reduce((sum, [_, v]) => sum + v, 0);

      const pieData = Object.entries(stats?.attack_counts || {}).map(([name, value]) => ({ name, value }));

      return (
        <div style={{padding: '40px', maxWidth: '1200px', margin: '0 auto'}}>
          <header className="flex-between" style={{marginBottom: '32px'}}>
            <h1 className="title-glow" style={{fontSize: '2rem'}}>🛡️ Nexus IDS Dashboard</h1>
            <div style={{color: 'var(--text-muted)'}}>Two-Stage FT-Transformer Architecture</div>
          </header>

          <div className="grid-4">
            <div className="glass-panel" style={{textAlign: 'center'}}>
              <div style={{color: '#38bdf8', fontSize: '1.5rem'}}>🌐</div>
              <div className="stat-value">{stats?.total_vectors.toLocaleString() || 0}</div>
              <div style={{color: 'var(--text-muted)', fontSize: '0.9rem'}}>Total Packets Scanned</div>
            </div>
            <div className="glass-panel" style={{textAlign: 'center'}}>
              <div style={{color: '#10b981', fontSize: '1.5rem'}}>✅</div>
              <div className="stat-value" style={{color: '#10b981'}}>
                {stats?.attack_counts['Normal']?.toLocaleString() || 0}
              </div>
              <div style={{color: 'var(--text-muted)', fontSize: '0.9rem'}}>Benign Traffic</div>
            </div>
            <div className="glass-panel" style={{textAlign: 'center', position: 'relative', overflow: 'hidden'}}>
              <div style={{position: 'absolute', inset: 0, background: 'rgba(244, 63, 94, 0.05)'}}></div>
              <div style={{color: '#f43f5e', fontSize: '1.5rem'}}>⚠️</div>
              <div className="stat-value" style={{color: '#f43f5e'}}>{totalAttacks.toLocaleString()}</div>
              <div style={{color: 'var(--text-muted)', fontSize: '0.9rem'}}>Attacks Detected</div>
            </div>
            <div className="glass-panel" style={{textAlign: 'center'}}>
              <div style={{color: '#c084fc', fontSize: '1.5rem'}}>🧠</div>
              <div className="stat-value">
                {stats?.overall_mean_confidence ? (stats.overall_mean_confidence * 100).toFixed(1) : 0}%
              </div>
              <div style={{color: 'var(--text-muted)', fontSize: '0.9rem'}}>AI Confidence Score</div>
            </div>
          </div>

          <div className="grid-2">
            <div className="glass-panel">
              <h2 style={{marginTop: 0}}>Traffic Composition</h2>
              <div style={{height: '300px'}}>
                <ResponsiveContainer width="100%" height="100%">
                  <BarChart data={pieData}>
                    <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,0.15)" />
                    <XAxis dataKey="name" stroke="#cbd5e1" tick={{fill: '#cbd5e1'}} />
                    <YAxis stroke="#cbd5e1" tick={{fill: '#cbd5e1'}} />
                    <Tooltip contentStyle={{ background: '#1e293b', border: '1px solid rgba(56, 189, 248, 0.5)', color: '#fff' }} itemStyle={{color: '#fff'}} />
                    <Bar dataKey="value" radius={[4, 4, 0, 0]}>
                      {pieData.map((entry, index) => (
                        <Cell key={`cell-${index}`} fill={COLORS[entry.name] || '#0ea5e9'} />
                      ))}
                    </Bar>
                  </BarChart>
                </ResponsiveContainer>
              </div>
            </div>
            <div className="glass-panel">
              <h2 style={{marginTop: 0}}>Threat Distribution</h2>
              <div style={{height: '300px'}}>
                <ResponsiveContainer width="100%" height="100%">
                  <PieChart>
                    <Pie 
                      data={pieData.filter(d => d.name !== 'Normal')} 
                      cx="50%" cy="50%" 
                      innerRadius={60} outerRadius={90} 
                      paddingAngle={5} 
                      dataKey="value"
                    >
                      {pieData.filter(d => d.name !== 'Normal').map((entry, index) => (
                        <Cell key={`cell-${index}`} fill={COLORS[entry.name] || '#0ea5e9'} />
                      ))}
                    </Pie>
                    <Tooltip contentStyle={{ background: '#1e293b', border: '1px solid rgba(56, 189, 248, 0.5)', color: '#fff' }} itemStyle={{color: '#fff'}} />
                  </PieChart>
                </ResponsiveContainer>
              </div>
            </div>
          </div>

          <DetectionControl onComplete={loadStats} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Dashboard />);
  </script>
</body>
</html>
